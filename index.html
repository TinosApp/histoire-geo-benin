lages et exode rural\n• Baisse des recettes et perte de compétitivité"}, {"label": "Consigne 5", "points": 2, "text": "• Point de vue argumenté : les péages financent l'entretien des routes et sont acceptables s'ils sont bien gérés et transparents ; mais ils peuvent renchérir les prix et pénaliser les transporteurs si les routes restent mauvaises"}]}]}, {"id": "E9", "num": "9", "parts": [{"partie": "Histoire", "type": "Dissertation", "sa": "SA2", "contexte": "Depuis 1945, les agences spécialisées de l'ONU interviennent dans la vie quotidienne de millions de personnes, y compris au Bénin.", "tache": "Pour expliquer l'action de l'ONU à travers ses agences, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente le rôle de trois agences spécialisées de l'ONU.", "Illustre leur action au Bénin ou en Afrique par des exemples précis.", "Porte un jugement critique sur les limites de cette action."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : l'ONU agit aussi par ses agences spécialisées, présentes dans presque tous les pays\n• Problématique : ces agences jouent un rôle important, mais leur action a des limites\n• Plan : rôle de trois agences, exemples en Afrique, limites"}, {"label": "Consigne 1", "points": 3, "text": "• OMS (Genève) : santé publique, vaccination, lutte contre les épidémies\n• UNICEF (New York) : protection et éducation de l'enfance\n• PAM (Rome) : aide alimentaire d'urgence"}, {"label": "Consigne 2", "points": 3, "text": "• OMS : campagnes de vaccination contre la poliomyélite et la rougeole en Afrique de l'Ouest\n• UNICEF : programmes scolaires et de nutrition infantile au Bénin\n• PAM : distributions alimentaires lors de crises (Sahel)"}, {"label": "Consigne 3", "points": 3, "text": "• Dépendance aux financements des pays riches, parfois irréguliers\n• Actions parfois ponctuelles, sans continuité suffisante\n• Risque de dépendance des États bénéficiaires envers l'aide extérieure"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : les agences de l'ONU apportent une aide réelle mais incomplète\n• Ouverture : nécessité pour les États de renforcer leurs propres services publics"}]}, {"partie": "Géographie", "type": "Commentaire de texte", "sa": "SA1", "contexte": "La transformation locale des matières premières est présentée comme une solution à la dépendance économique du Bénin.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer l'intérêt de la transformation locale du coton au Bénin.", "support": "Texte (rédigé pour l'exercice) : « Premier produit d'exportation du Bénin, le coton est encore vendu en grande partie à l'état brut. En le transformant sur place en fil, en tissu ou en vêtements, le pays gagnerait davantage de valeur ajoutée, créerait des emplois industriels et réduirait sa dépendance aux cours mondiaux. Des unités de filature existent déjà, mais elles restent peu nombreuses, faute d'investissements suffisants et d'une énergie fiable et bon marché. »", "consignes": ["Présente le texte.", "Explique l'intérêt de la transformation locale du coton.", "Détermine les obstacles à cette transformation.", "Propose une solution pour lever l'un de ces obstacles."], "elements": [{"label": "Consigne 1 : Présentation du texte", "points": 2, "text": "• Nature : texte explicatif (analyse économique)\n• Source : texte rédigé pour l'exercice\n• Cadre géographique : Bénin, pays à économie dominée\n• Idée générale : la transformation du coton reste un enjeu majeur, mais elle bute sur des obstacles\n• Centres d'intérêt : 1) l'intérêt de la transformation, 2) les obstacles"}, {"label": "Consigne 2 : Explication", "points": 3, "text": "• Plus grande valeur ajoutée qu'à l'exportation du coton brut\n• Création d'emplois industriels (filature, tissage, confection)\n• Réduction de la dépendance aux cours mondiaux du coton brut\n• Développement de filières locales (textile béninois)"}, {"label": "Consigne 3 : Jugement critique", "points": 3, "text": "• Manque d'investissements dans les unités de transformation\n• Coût et irrégularité de l'énergie\n• Concurrence des textiles importés, parfois à bas prix\n• Manque de main-d'œuvre qualifiée dans certains métiers du textile"}, {"label": "Consigne 4 : Intérêt et portée", "points": 2, "text": "• Exemple : pour l'énergie, développer les capacités solaires et améliorer le réseau afin de réduire son coût pour les unités industrielles"}]}]}, {"id": "E10", "num": "10", "parts": [{"partie": "Histoire", "type": "Réponds directement aux consignes", "sa": "SA4", "contexte": "Après près de deux décennies de régime militaire puis marxiste-léniniste, le Bénin traverse une profonde crise à la fin des années 1980. En février 1990, les forces vives de la Nation se réunissent.", "tache": "Réponds directement aux consignes suivantes.", "support": "", "consignes": ["Explique les raisons de la tenue de la Conférence nationale de février 1990.", "Présente les principales décisions qui ont suivi la Conférence nationale.", "Donne ton opinion sur l'importance de la Conférence nationale pour la vie politique béninoise d'aujourd'hui."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Crise économique et financière : difficultés de l'État, salaires impayés aux fonctionnaires\n• Mécontentement social : grèves, contestation des étudiants et des syndicats\n• Perte de légitimité d'un régime autoritaire à parti unique\n• Contexte international : vent de démocratisation en Europe de l'Est en 1989\n• Pression des forces vives (syndicats, Églises, intellectuels, partis d'opposition)"}, {"label": "Consigne 2", "points": 3, "text": "• Fin du régime marxiste-léniniste\n• Retour au multipartisme et aux libertés (expression, association, presse)\n• Adoption d'une nouvelle Constitution en décembre 1990\n• Élection présidentielle de mars 1991 : Nicéphore Soglo est élu"}, {"label": "Consigne 3", "points": 4, "text": "• Point de vue argumenté : la Conférence nationale est un modèle de transition pacifique en Afrique\n• Elle a installé les libertés publiques, l'alternance et des élections régulières\n• Mais la démocratie doit rester consolidée : institutions solides, lutte contre la pauvreté, participation des citoyens\n• Conclusion nuancée : un acquis à préserver et à approfondir"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "SA3", "contexte": "Le Japon, archipel pauvre en ressources naturelles, figure parmi les grandes puissances économiques du monde.", "tache": "Pour expliquer la place du Japon dans l'économie mondiale, produis une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les atouts qui expliquent la puissance économique du Japon.", "Détermine les problèmes auxquels son économie est confrontée.", "Expose les stratégies mises en œuvre pour y faire face."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : le Japon, archipel d'Asie de l'Est, est l'une des premières économies mondiales\n• Problématique : comment un pays sans ressources est-il devenu une puissance et comment s'y maintient-il ?\n• Plan : atouts, problèmes, stratégies"}, {"label": "Consigne 1", "points": 3, "text": "• Naturels : insularité (pêche, ports), importation des matières premières\n• Humains : population instruite et disciplinée, forte épargne\n• Organisationnels : grandes firmes liées aux banques, sociétés de commerce, sous-traitance, coopération État-entreprises\n• Transition : cette réussite fait face à des difficultés"}, {"label": "Consigne 2", "points": 3, "text": "• Territoire exigu, dépendance énergétique et minière\n• Vieillissement de la population\n• Concurrence de la Chine, de la Corée du Sud, des États-Unis\n• Déclin de certaines industries (textile), catastrophes naturelles\n• Transition : le Japon doit donc adapter sa stratégie"}, {"label": "Consigne 3", "points": 3, "text": "• Restructuration industrielle, recherche-développement\n• Industries de haute technologie\n• Délocalisations vers l'Asie du Sud-Est\n• Diversification des partenaires commerciaux"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : le Japon reste une puissance grâce à l'organisation et à l'innovation\n• Ouverture : quelles leçons pour l'Afrique ?"}]}]}, {"id": "E11", "num": "11", "parts": [{"partie": "Histoire", "type": "Commentaire de texte", "sa": "SA2", "contexte": "Depuis sa création, le fonctionnement du Conseil de sécurité de l'ONU est critiqué par de nombreux États.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer les critiques adressées au droit de veto.", "support": "Texte (rédigé pour l'exercice) : « Depuis 1945, cinq États disposent au Conseil de sécurité d'un siège permanent et du droit de veto. Ce privilège leur permet de bloquer toute décision qui menace leurs intérêts, même lorsque la majorité des membres y est favorable. Ainsi, face à certaines guerres, le Conseil est resté paralysé pendant des mois. Beaucoup d'États, notamment africains, réclament un Conseil plus représentatif du monde d'aujourd'hui. Mais les cinq membres permanents refusent de renoncer à leurs prérogatives. »", "consignes": ["Présente le texte.", "Explique les idées développées par l'auteur.", "Porte un jugement critique sur ce texte.", "Dégage l'intérêt et la portée du texte."], "elements": [{"label": "Consigne 1 : Présentation du texte", "points": 2, "text": "• Nature : texte explicatif et critique\n• Source : texte rédigé pour l'exercice\n• Auteur : un observateur des relations internationales\n• Destinataires : opinion publique, États membres\n• Contexte : débat sur la réforme de l'ONU\n• Idée générale : le veto paralyse le Conseil de sécurité et appelle une réforme\n• Centres d'intérêt : 1) le privilège des cinq membres permanents, 2) les blocages, 3) les demandes de réforme"}, {"label": "Consigne 2 : Explication", "points": 3, "text": "• Le veto permet à un membre permanent de bloquer une décision, même approuvée par la majorité\n• Il est contraire à l'égalité entre les États membres\n• Le Conseil peut être paralysé face à certaines guerres\n• Les États africains demandent un Conseil plus représentatif (élargissement)\n• Les cinq permanents refusent de perdre leurs privilèges"}, {"label": "Consigne 3 : Jugement critique", "points": 3, "text": "• Forme : texte clair et concis\n• Fond : critique juste du veto, mais qui ne rappelle pas les réussites du Conseil (casques bleus, sanctions)\n• Le blocage vient aussi du manque de volonté politique des États\n• La réforme est difficile car elle exige l'accord des membres permanents"}, {"label": "Consigne 4 : Intérêt et portée", "points": 2, "text": "• Intérêt : montre les limites du fonctionnement du Conseil de sécurité\n• Portée : nourrit le débat sur l'élargissement du Conseil et la place de l'Afrique"}]}, {"partie": "Géographie", "type": "Réponds directement aux consignes", "sa": "SA6", "contexte": "Face à l'étroitesse de leurs marchés, de nombreux États se regroupent au sein d'organisations économiques.", "tache": "Réponds directement aux consignes suivantes.", "support": "", "consignes": ["Définis « regroupement économique » et cite deux exemples de regroupements dans le monde.", "Présente trois organes de la CEDEAO et le rôle de chacun.", "Explique les conséquences possibles du retrait du Mali, du Burkina Faso et du Niger sur l'intégration ouest-africaine."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Définition : association de pays qui réduisent les obstacles à leurs échanges\n• Exemples : Union européenne, ASEAN, MERCOSUR, ALENA/ACEUM, UEMOA\n• Niveaux d'intégration (facultatif) : libre-échange, union douanière, marché commun, union économique et monétaire"}, {"label": "Consigne 2", "points": 3, "text": "• Conférence des chefs d'État : organe suprême, fixe les grandes orientations\n• Conseil des ministres : assure le fonctionnement et le développement de la Communauté\n• Commission : organe exécutif, siège à Abuja\n• Parlement et Cour de justice ; BIDC (Lomé) : finance des projets"}, {"label": "Consigne 3", "points": 4, "text": "• Réduction du marché régional et de la population de la Communauté\n• Risques pour le commerce et la libre circulation dans la région\n• Difficultés pour la sécurité et la coordination régionales\n• Recomposition des partenariats (nouveaux partenaires, accords séparés)\n• Nuance : la CEDEAO doit renforcer le dialogue et la coopération pour préserver l'intégration"}]}]}], "exercices": [{"id": "E1", "sa": "SA1", "niveau": "Avancé", "enonce": "Le coton est le principal produit d'exportation du Bénin. Expliquez pourquoi cette spécialisation entretient la dépendance du pays, puis proposez deux solutions argumentées.", "total": 10}, {"id": "E2", "sa": "SA2", "niveau": "Avancé", "enonce": "L'ONU réussit-elle toujours à maintenir la paix ? Répondez en vous appuyant sur ses organes et sur deux exemples d'actions ou de limites.", "total": 10}, {"id": "E3", "sa": "SA3", "niveau": "Avancé", "enonce": "Malgré la pauvreté de son sol en ressources, le Japon est une puissance économique. Expliquez ce paradoxe.", "total": 10}, {"id": "E4", "sa": "SA4", "niveau": "Avancé", "enonce": "Montrez que l'indépendance du Dahomey résulte à la fois de la lutte des Dahoméens et du contexte international.", "total": 10}, {"id": "E5", "sa": "SA5", "niveau": "Avancé", "enonce": "Comparez le modèle de développement de la Chine et celui du Brésil, puis montrez leurs limites communes.", "total": 10}, {"id": "E6", "sa": "SA6", "niveau": "Avancé", "enonce": "La CEDEAO a-t-elle atteint ses objectifs d'intégration ? Discutez avec des réalisations et des difficultés, puis expliquez l'intérêt du Bénin.", "total": 10}], "corriges_exercices": [{"id": "E1", "ordre": 1, "element": "Définitions", "points": 2, "texte": "Une économie dominée dépend de l'extérieur pour ses revenus et ses produits manufacturés."}, {"id": "E1", "ordre": 2, "element": "Causes de la dépendance", "points": 4, "texte": "• Coton exporté surtout à l'état brut, peu de transformation locale\n• Prix dépendant des cours mondiaux, donc recettes instables\n• Importation de produits finis plus chers\n• La spécialisation freine la diversification"}, {"id": "E1", "ordre": 3, "element": "Deux solutions", "points": 3, "texte": "• Transformer le coton sur place (filature, textile) pour gagner de la valeur ajoutée\n• Diversifier l'économie (autres cultures, agro-industrie, services autour du port de Cotonou)"}, {"id": "E1", "ordre": 4, "element": "Méthode", "points": 1, "texte": "Introduction, plan, conclusion, clarté."}, {"id": "E2", "ordre": 1, "element": "Missions et organes", "points": 3, "texte": "La Charte de 1945 confie le maintien de la paix au Conseil de sécurité, qui peut décider de sanctions et de missions de casques bleus."}, {"id": "E2", "ordre": 2, "element": "Deux exemples", "points": 3, "texte": "• Une réussite : des missions de paix ont aidé à stabiliser certains pays après des conflits\n• Une limite : des crises où l'ONU n'a pas pu agir à temps"}, {"id": "E2", "ordre": 3, "element": "Limites", "points": 3, "texte": "• Droit de veto des cinq membres permanents\n• Manque de moyens financiers et militaires\n• Dépendance à la volonté des États membres"}, {"id": "E2", "ordre": 4, "element": "Conclusion nuancée", "points": 1, "texte": "L'ONU joue un rôle utile, mais son efficacité reste limitée."}, {"id": "E3", "ordre": 1, "element": "Le paradoxe", "points": 2, "texte": "Le Japon est pauvre en ressources (pétrole, minerais) mais figure parmi les premières puissances économiques."}, {"id": "E3", "ordre": 2, "element": "Facteurs", "points": 4, "texte": "• Importation de matières premières, transformées en produits à forte valeur ajoutée\n• Technologie et recherche (automobile, électronique, robotique)\n• Main-d'œuvre qualifiée et disciplinée\n• Grandes firmes (Toyota, Sony) et exportations mondiales"}, {"id": "E3", "ordre": 3, "element": "Organisation de l'espace", "points": 2, "texte": "Industries et ports concentrés sur la façade pacifique, autour de Tokyo, Osaka et Nagoya."}, {"id": "E3", "ordre": 4, "element": "Limites", "points": 2, "texte": "Vieillissement de la population, dépendance énergétique, risques naturels."}, {"id": "E4", "ordre": 1, "element": "Facteurs internes", "points": 4, "texte": "• Résistance armée de Béhanzin (1892-1894)\n• Après 1945 : partis politiques, syndicats, élites (Apithy, Maga, Ahomadégbé)\n• Refus du travail forcé et de l'injustice coloniale"}, {"id": "E4", "ordre": 2, "element": "Facteurs externes", "points": 3, "texte": "• Conséquences de la Seconde Guerre mondiale\n• Rôle de l'ONU et de la Charte\n• Bandung (1955), loi-cadre Defferre (1956), référendum de 1958"}, {"id": "E4", "ordre": 3, "element": "Étapes et dates", "points": 2, "texte": "République autonome en 1958, puis indépendance le 1er août 1960."}, {"id": "E4", "ordre": 4, "element": "Conclusion", "points": 1, "texte": "L'indépendance est le résultat de la lutte des Dahoméens et d'un contexte international favorable."}, {"id": "E5", "ordre": 1, "element": "Chine", "points": 3, "texte": "• Réformes de 1978 sous Deng Xiaoping\n• Zones économiques spéciales (Shenzhen) et investissements étrangers\n• Main-d'œuvre nombreuse, « atelier du monde »"}, {"id": "E5", "ordre": 2, "element": "Brésil", "points": 3, "texte": "• Agriculture puissante (soja, café, canne à sucre) et ressources minières\n• Industrie et services du Sud-Est (São Paulo)\n• Grand marché intérieur"}, {"id": "E5", "ordre": 3, "element": "Limites communes", "points": 3, "texte": "Inégalités sociales et territoriales, atteintes à l'environnement (pollution en Chine, déforestation de l'Amazonie), dépendance aux marchés extérieurs."}, {"id": "E5", "ordre": 4, "element": "Comparaison", "points": 1, "texte": "La Chine mise surtout sur l'industrie exportatrice, le Brésil davantage sur les matières premières et le marché intérieur."}, {"id": "E6", "ordre": 1, "element": "Objectifs", "points": 2, "texte": "Créée à Lagos en 1975 : union économique, libre circulation, paix en Afrique de l'Ouest."}, {"id": "E6", "ordre": 2, "element": "Réalisations", "points": 3, "texte": "Protocole de libre circulation (1979), interventions pour la paix (ECOMOG), infrastructures (corridors routiers, énergie)."}, {"id": "E6", "ordre": 3, "element": "Difficultés", "points": 3, "texte": "• Commerce faible entre pays membres, aux économies proches\n• Instabilité politique et conflits\n• Obstacles administratifs\n• Retrait du Mali, du Burkina Faso et du Niger en 2025"}, {"id": "E6", "ordre": 4, "element": "Le Bénin", "points": 2, "texte": "Le port de Cotonou dessert l'hinterland, et le marché nigérian offre un fort potentiel, mais avec des risques de dépendance."}], "questions": [{"partie": "Histoire", "sa": "SA4", "q": "Cite trois facteurs internes du processus d'émancipation des peuples d'Afrique.", "r": "Le rôle de l'école (idées de liberté et d'égalité), le rôle des églises, l'action des partis politiques, syndicats et intellectuels nationalistes."}, {"partie": "Histoire", "sa": "SA4", "q": "Énonce les raisons de l'adoption de la loi-cadre du 23 juin 1956.", "r": "Agitation nationaliste croissante, contexte international défavorable au colonialisme (Bandung, Ghana), volonté de la France de canaliser le mouvement, échec des réformes de 1946, guerre d'Algérie."}, {"partie": "Histoire", "sa": "SA4", "q": "Évoque quelques réformes de la loi-cadre du 23 juin 1956.", "r": "Collège unique, suffrage universel, conseils de gouvernement, assemblées territoriales aux pouvoirs élargis, africanisation des cadres."}, {"partie": "Histoire", "sa": "SA4", "q": "Décris le contenu de la Constitution de 1946 (Union française).", "r": "Les colonies deviennent des territoires d'outre-mer ; représentation au Parlement français et dans des assemblées locales ; citoyenneté pour les cadres ; le pouvoir reste à Paris."}, {"partie": "Histoire", "sa": "SA4", "q": "Cite les étapes de la décolonisation au Dahomey.", "r": "1946 : représentation et partis ; 1956 : loi-cadre ; 28 septembre 1958 : référendum ; 4 décembre 1958 : République autonome ; 1959 : Constitution et gouvernement Maga ; 11 juillet 1960 : transfert des compétences ; 1er août 1960 : indépendance."}, {"partie": "Histoire", "sa": "SA4", "q": "Au débat, un camarade dit : « Le Dahomey a eu une indépendance octroyée ». Donne ton point de vue.", "r": "On peut le nuancer : l'indépendance a été négociée, obtenue sans guerre, après des réformes accordées par la France ; mais elle résulte aussi de la pression des nationalistes et d'un contexte international favorable. Elle est donc à la fois octroyée et conquise."}, {"partie": "Histoire", "sa": "SA4", "q": "Donne les contraintes de la gestion du Bénin après l'indépendance.", "r": "Pauvreté, dépendance envers la France, régionalisme, rivalités politiques, grèves, manque de cadres, coups d'État à répétition."}, {"partie": "Histoire", "sa": "SA4", "q": "Que retiens-tu de la Conférence nationale de février 1990 ?", "r": "Réunion des forces vives de la Nation ; fin du régime marxiste-léniniste ; ouverture au multipartisme ; adoption d'une Constitution en décembre 1990 ; élection présidentielle de 1991."}, {"partie": "Histoire", "sa": "SA4", "q": "Donne les raisons de l'anticolonialisme des États-Unis.", "r": "Leur propre histoire (indépendance contre la Grande-Bretagne), intérêts économiques (ouvrir les marchés), rivalité avec l'URSS, principes de la Charte de l'Atlantique."}, {"partie": "Histoire", "sa": "SA4", "q": "Cite les formes de lutte pour l'indépendance avec un exemple.", "r": "Pacifique : Ghana ; négociée : Dahomey et la plupart des colonies françaises d'Afrique noire ; armée : Algérie, Angola, Kenya."}, {"partie": "Histoire", "sa": "SA4", "q": "Présente les causes et conséquences de la guerre d'Algérie (1954-1962).", "r": "Causes : refus de l'indépendance, inégalités entre colons et Algériens, montée du FLN. Conséquences : accords d'Évian (mars 1962), indépendance en juillet 1962, exode des Européens, chute de la IVe République et retour de de Gaulle."}, {"partie": "Histoire", "sa": "SA2", "q": "Donne ton opinion sur le droit d'ingérence exercé par l'ONU dans certaines crises.", "r": "Utile pour protéger les civils en cas de crimes graves ; mais risque d'abus, d'application inégale (veto) et d'atteinte à la souveraineté ; il faut un mandat clair et une intervention encadrée."}, {"partie": "Histoire", "sa": "SA2", "q": "Cite les actions de l'ONU dans l'émancipation des peuples colonisés.", "r": "Charte de 1945, Conseil de tutelle, résolution 1514 (1960), comité de décolonisation, tribune des pays afro-asiatiques, admission des nouveaux États."}, {"partie": "Histoire", "sa": "SA2", "q": "Qui a été secrétaire général de l'ONU de 1997 à 2006 ? Donne sa nationalité.", "r": "Kofi Annan, diplomate ghanéen, prix Nobel de la paix en 2001."}, {"partie": "Géographie", "sa": "SA6", "q": "Cite trois sous-organisations ou institutions de la CEDEAO.", "r": "BIDC (Lomé), OOAS (Bobo-Dioulasso), Parlement et Cour de justice ; Commission à Abuja."}, {"partie": "Géographie", "sa": "SA5", "q": "Donne deux limites communes de l'émergence de la Chine et du Brésil.", "r": "Fortes inégalités sociales et territoriales ; atteintes à l'environnement ; dépendance aux exportations."}, {"partie": "Histoire", "sa": "SA2", "q": "Quelle est la règle de vote d'une décision de fond au Conseil de sécurité ?", "r": "Il faut 9 voix sur 15, sans veto d'un membre permanent ; l'abstention d'un membre permanent ne bloque pas la décision."}, {"partie": "Histoire", "sa": "SA2", "q": "Cite trois agences de l'ONU avec leur siège.", "r": "PAM (Rome), OMS (Genève), UNESCO (Paris) ; aussi FAO (Rome), UNICEF (New York), HCR (Genève)."}, {"partie": "Histoire", "sa": "SA2", "q": "Retrace les grandes étapes de la création de l'ONU (1941-1945).", "r": "Charte de l'Atlantique (août 1941), Déclaration des Nations unies (1er janvier 1942), Moscou et Téhéran (1943), Dumbarton Oaks (1944), Yalta (février 1945), San Francisco (Charte signée le 26 juin 1945), entrée en vigueur le 24 octobre 1945."}, {"partie": "Histoire", "sa": "SA4", "q": "Qui est Béhanzin et pourquoi est-il important ?", "r": "Roi d'Abomey (1889-1894) qui a résisté à la conquête française de 1892 à 1894 ; vaincu, il a été déporté. C'est un symbole de la résistance à la colonisation."}, {"partie": "Histoire", "sa": "SA4", "q": "Cite trois coups d'État du Dahomey/Bénin entre 1963 et 1972 avec leurs auteurs.", "r": "Octobre 1963 : colonel Soglo ; fin 1965 : colonel Soglo ; décembre 1967 : Kouandété et les jeunes officiers ; décembre 1969 : nouveau coup d'État ; 26 octobre 1972 : commandant Kérékou."}, {"partie": "Histoire", "sa": "SA4", "q": "Quelles ont été les conséquences de la Conférence nationale de 1990 ?", "r": "Fin du régime marxiste-léniniste, retour au multipartisme, Constitution de décembre 1990, élection de Nicéphore Soglo en 1991."}, {"partie": "Géographie", "sa": "SA1", "q": "Pourquoi le port de Cotonou est-il important pour le Bénin ?", "r": "Il est la porte d'entrée maritime du pays et de l'hinterland (Niger, Burkina Faso, Mali) ; il alimente le transit et la réexportation vers le Nigeria, avec les recettes et les emplois qui en découlent."}, {"partie": "Géographie", "sa": "SA1", "q": "Cite trois problèmes de l'agriculture béninoise.", "r": "Agriculture peu mécanisée, aléas climatiques, dépendance au coton, difficultés d'accès au crédit, pistes rurales dégradées, faible transformation locale."}, {"partie": "Géographie", "sa": "SA1", "q": "Cite trois atouts touristiques du Bénin.", "r": "Parcs de la Pendjari et du W, cité lacustre de Ganvié, palais royaux d'Abomey, Ouidah (Porte du non-retour), chutes de Kota et de Tanougou, Vodoun."}, {"partie": "Géographie", "sa": "SA3", "q": "Cite deux problèmes de l'économie japonaise.", "r": "Vieillissement de la population, dépendance énergétique et minière, concurrence de la Chine et de la Corée du Sud, risques naturels."}, {"partie": "Géographie", "sa": "SA5", "q": "Pourquoi appelle-t-on la Chine « l'atelier du monde » ?", "r": "Elle fabrique et exporte en masse des textiles, des appareils électroniques et des machines, grâce à une main-d'œuvre nombreuse et peu coûteuse et à des zones économiques spéciales."}, {"partie": "Géographie", "sa": "SA5", "q": "Qu'est-ce qu'un pays émergent ?", "r": "Un pays à forte croissance économique mais où les inégalités persistent (exemples : Chine, Brésil, membres des BRICS)."}, {"partie": "Géographie", "sa": "SA6", "q": "Quels sont les niveaux d'intégration économique ?", "r": "Zone de libre-échange, union douanière, marché commun, union économique et monétaire."}, {"partie": "Géographie", "sa": "SA6", "q": "Quand la CEDEAO a-t-elle été créée et par combien de pays ?", "r": "Le 28 mai 1975 à Lagos (traité de Lagos), par 15 pays fondateurs ; traité révisé à Cotonou en 1993."}], "reperes": [{"cat": "Chronologie", "a": "1892", "b": "Début de la guerre de résistance du roi Béhanzin contre la conquête française"}, {"cat": "Chronologie", "a": "1895", "b": "Création de l'AOF (Afrique-Occidentale française)"}, {"cat": "Chronologie", "a": "1941", "b": "Charte de l'Atlantique"}, {"cat": "Chronologie", "a": "1942", "b": "Déclaration des Nations unies (1er janvier)"}, {"cat": "Chronologie", "a": "1943", "b": "Conférences de Moscou (octobre) et de Téhéran"}, {"cat": "Chronologie", "a": "1944", "b": "Conférence de Brazzaville (30 janvier-8 février) ; conférence de Dumbarton Oaks (août-octobre)"}, {"cat": "Chronologie", "a": "1945", "b": "Fin de la Seconde Guerre mondiale ; création de l'ONU (Charte signée le 26 juin)"}, {"cat": "Chronologie", "a": "1946", "b": "Constitution de la IVe République et Union française (27 octobre) ; création du RDA ; fin du travail forcé"}, {"cat": "Chronologie", "a": "1948", "b": "Déclaration universelle des droits de l'homme (10 décembre)"}, {"cat": "Chronologie", "a": "1954", "b": "Défaite de la France à Dien Bien Phu ; début de la guerre d'Algérie"}, {"cat": "Chronologie", "a": "1955", "b": "Conférence de Bandung"}, {"cat": "Chronologie", "a": "1956", "b": "Loi-cadre Defferre (23 juin)"}, {"cat": "Chronologie", "a": "1957", "b": "Indépendance du Ghana"}, {"cat": "Chronologie", "a": "1958", "b": "Retour de de Gaulle ; référendum du 28 septembre ; 2 octobre : indépendance de la Guinée ; 4 décembre : République du Dahomey"}, {"cat": "Chronologie", "a": "1959", "b": "Constitution du Dahomey (14 février) ; Hubert Maga chef du gouvernement (mai)"}, {"cat": "Chronologie", "a": "1960", "b": "Année des indépendances africaines ; 1er août : indépendance du Dahomey ; septembre : admission du Dahomey à l'ONU ; 14 décembre : résolution 1514 de l'ONU"}, {"cat": "Chronologie", "a": "1962", "b": "Indépendance de l'Algérie"}, {"cat": "Chronologie", "a": "1963", "b": "Premier coup d'État au Dahomey (octobre)"}, {"cat": "Chronologie", "a": "1965", "b": "Nouveau coup d'État du colonel Soglo (fin d'année)"}, {"cat": "Chronologie", "a": "1967", "b": "Coup d'État des jeunes officiers autour de Kouandété (décembre)"}, {"cat": "Chronologie", "a": "1968", "b": "Émile Derlin Zinsou à la tête de l'État"}, {"cat": "Chronologie", "a": "1970", "b": "Mise en place du Conseil présidentiel (Maga, Apithy, Ahomadégbé)"}, {"cat": "Chronologie", "a": "1972", "b": "Coup d'État de Mathieu Kérékou (26 octobre)"}, {"cat": "Chronologie", "a": "1975", "b": "Création de la CEDEAO (28 mai, Lagos) ; le Dahomey devient République populaire du Bénin (30 novembre)"}, {"cat": "Chronologie", "a": "1978", "b": "Réformes de Deng Xiaoping en Chine"}, {"cat": "Chronologie", "a": "1979", "b": "Protocole de libre circulation des personnes de la CEDEAO"}, {"cat": "Chronologie", "a": "1987", "b": "Création de l'OOAS (Organisation ouest-africaine de la santé)"}, {"cat": "Chronologie", "a": "1990", "b": "Conférence nationale des forces vives de la Nation (février) ; Constitution (décembre)"}, {"cat": "Chronologie", "a": "1991", "b": "Élection de Nicéphore Soglo à la présidence du Bénin"}, {"cat": "Chronologie", "a": "1993", "b": "Traité révisé de la CEDEAO, signé à Cotonou"}, {"cat": "Chronologie", "a": "1994", "b": "Suspension de l'activité du Conseil de tutelle de l'ONU"}, {"cat": "Chronologie", "a": "2001", "b": "Entrée de la Chine à l'OMC"}, {"cat": "Chronologie", "a": "2025", "b": "Retrait du Mali, du Burkina Faso et du Niger de la CEDEAO"}, {"cat": "Personnage", "a": "Hubert Maga", "b": "Homme politique dahoméen ; chef du gouvernement en 1959 ; premier président du Dahomey (1960-1963)"}, {"cat": "Personnage", "a": "Sourou Migan Apithy", "b": "Né en 1913 à Porto-Novo ; chef du gouvernement autonome (1957-1959) ; président du Dahomey (1964-1965)"}, {"cat": "Personnage", "a": "Justin Ahomadégbé", "b": "Né en 1917 à Abomey ; Premier ministre (1964-1965) ; président du Conseil présidentiel en 1972"}, {"cat": "Personnage", "a": "Mathieu Kérékou", "b": "Chef de l'État à partir du coup d'État du 26 octobre 1972"}, {"cat": "Personnage", "a": "Charles de Gaulle", "b": "Général, chef de la France libre ; retour au pouvoir en 1958 ; fondateur de la Ve République ; président de 1959 à 1969"}, {"cat": "Personnage", "a": "Félix Houphouët-Boigny", "b": "Leader du RDA, ministre en France, premier président de la Côte d'Ivoire ; auteur de la loi supprimant le travail forcé"}, {"cat": "Personnage", "a": "Kwame Nkrumah", "b": "Père de l'indépendance du Ghana (1957) ; panafricaniste"}, {"cat": "Personnage", "a": "Léopold Sédar Senghor", "b": "Poète, premier président du Sénégal (1960-1980)"}, {"cat": "Personnage", "a": "Sékou Touré", "b": "Premier président de la Guinée indépendante ; a fait voter « non » en 1958"}, {"cat": "Personnage", "a": "Modibo Keïta", "b": "Premier président du Mali (1960-1968) ; panafricaniste"}, {"cat": "Personnage", "a": "Patrice Lumumba", "b": "Premier Premier ministre du Congo indépendant (1960), assassiné en 1961"}, {"cat": "Personnage", "a": "Kofi Annan", "b": "Secrétaire général de l'ONU (1997-2006) ; prix Nobel de la paix (2001)"}, {"cat": "Personnage", "a": "Boutros Boutros-Ghali", "b": "Secrétaire général de l'ONU (1992-1996)"}, {"cat": "Personnage", "a": "Ban Ki-moon", "b": "Secrétaire général de l'ONU (2007-2016)"}, {"cat": "Personnage", "a": "Albert Tévoédjrè", "b": "Homme politique et universitaire béninois ; médiateur de la République (2006-2013)"}, {"cat": "Personnage", "a": "Béhanzin", "b": "Roi d'Abomey (1889-1894) ; a résisté à la conquête française avant d'être vaincu et déporté"}, {"cat": "Personnage", "a": "Christophe Soglo", "b": "Colonel ; auteur des coups d'État d'octobre 1963 et de fin 1965"}, {"cat": "Personnage", "a": "Maurice Kouandété", "b": "Officier ; auteur des coups d'État de décembre 1967 et de décembre 1969"}, {"cat": "Personnage", "a": "Émile Derlin Zinsou", "b": "À la tête de l'État en 1968, renversé par le coup d'État de décembre 1969"}, {"cat": "Personnage", "a": "Nicéphore Soglo", "b": "Élu président du Bénin en 1991, après la Conférence nationale"}, {"cat": "Personnage", "a": "Deng Xiaoping", "b": "Dirigeant chinois, initiateur des réformes de 1978 (ouverture économique)"}], "methodes": [{"titre": "Format de l'épreuve", "texte": "Une épreuve d'Histoire-Géographie comporte deux parties : Histoire et Géographie. Chaque partie présente :\n• le contexte d'évaluation (la situation),\n• la tâche (ce que l'élève doit produire),\n• un support éventuel (texte, carte, tableau),\n• les consignes numérotées.\nTrois types de travail se rencontrent : la dissertation (3 consignes), le commentaire de document (4 consignes en Histoire, 5 en Géographie) et les questions à réponse directe (3 consignes). Le barème utilisé dans cette application (10 points par partie) est indicatif : à ajuster selon la grille officielle."}, {"titre": "Dissertation (Histoire ou Géographie)", "texte": "Introduction, en 3 temps : préambule (entrée en matière, sujet situé dans le temps et l'espace), problématique (formulée de façon affirmative, tirée de la tâche et des consignes), plan (annonce des parties, une par consigne).\nCorps du devoir : une partie par consigne, dans l'ordre, avec une transition entre chaque partie (elle rappelle la consigne précédente et annonce la suivante).\nConclusion : le point (bilan de ce qui a été dit) et l'ouverture (nouvelle question ou nouveau problème).\nÀ éviter : réciter le cours sans répondre à la consigne, oublier les transitions, mélanger les parties."}, {"titre": "Commentaire de texte historique (4 consignes)", "texte": "Consigne 1, Présenter le texte en 7 points : nature, source, auteur, destinataire, contexte historique, idée générale, centres d'intérêt (découpage du texte avec un titre par centre d'intérêt).\nConsigne 2, Expliquer : reprendre chaque centre d'intérêt, expliquer les mots et allusions importants, apporter des connaissances (quoi ? comment ? pourquoi ?).\nConsigne 3, Critique : juger le fond (erreurs, omissions, objectivité de l'auteur, qualités) et la forme (clarté, style).\nConsigne 4, Intérêt et portée : ce que le texte apprend (intérêt) et ses conséquences dans la suite des événements (portée).\nÀ éviter : la paraphrase, l'explication mot à mot, l'anachronisme, les critiques sans preuve."}, {"titre": "Commentaire de document géographique (5 consignes)", "texte": "Consigne 1, Présenter : nature, source, cadre géographique, idée générale, centres d'intérêt.\nConsigne 2, Interpréter : décrire ou expliquer le phénomène évoqué.\nConsigne 3, Causes : donner les raisons du phénomène.\nConsigne 4, Conséquences et solutions.\nConsigne 5, Bilan et opinion personnelle argumentée.\nConseil : rester collé au document (citer de courts extraits) et le compléter par ses connaissances."}, {"titre": "Réponds directement aux consignes", "texte": "Pas d'introduction ni de conclusion longues : répondre à chaque question dans l'ordre, avec des phrases complètes, des faits précis, des dates et des exemples. Numéroter les réponses comme les consignes."}], "short": {"SA1": "Économie du Bénin", "SA2": "L'ONU", "SA3": "Le Japon", "SA4": "Indépendances", "SA5": "Chine et Brésil", "SA6": "La CEDEAO"}, "qcm": [{"q": "Où la Charte des Nations unies a-t-elle été signée ?", "ok": "San Francisco", "ko": ["Yalta", "New York", "Genève"], "e": "La Charte a été signée à San Francisco le 26 juin 1945 et est entrée en vigueur le 24 octobre 1945.", "tag": "SA2"}, {"q": "Combien de membres compte le Conseil de sécurité de l'ONU ?", "ok": "15", "ko": ["5", "10", "20"], "e": "15 membres : 5 permanents avec droit de veto et 10 non permanents élus pour 2 ans.", "tag": "SA2"}, {"q": "Combien de voix faut-il pour adopter une décision de fond au Conseil de sécurité (sans veto) ?", "ok": "9 voix sur 15", "ko": ["8 voix sur 15", "10 voix sur 15", "La majorité de l'Assemblée générale"], "e": "Il faut 9 voix sur 15, sans veto d'un membre permanent ; l'abstention ne bloque pas.", "tag": "SA2"}, {"q": "Lequel de ces pays n'est PAS membre permanent du Conseil de sécurité ?", "ok": "L'Allemagne", "ko": ["La France", "La Chine", "Le Royaume-Uni"], "e": "Les cinq membres permanents sont les États-Unis, la Russie, le Royaume-Uni, la France et la Chine.", "tag": "SA2"}, {"q": "Quelle agence de l'ONU a son siège à Paris ?", "ok": "L'UNESCO", "ko": ["La FAO", "L'OMS", "Le PAM"], "e": "L'UNESCO est à Paris ; la FAO et le PAM sont à Rome, l'OMS à Genève.", "tag": "SA2"}, {"q": "Où se trouve le siège du Programme alimentaire mondial (PAM) ?", "ok": "Rome", "ko": ["Genève", "New York", "Washington"], "e": "Le PAM et la FAO ont leur siège à Rome.", "tag": "SA2"}, {"q": "Quelle est la date de la Déclaration de l'ONU sur l'octroi de l'indépendance aux peuples coloniaux (résolution 1514) ?", "ok": "14 décembre 1960", "ko": ["26 juin 1945", "10 décembre 1948", "23 juin 1956"], "e": "La résolution 1514 date du 14 décembre 1960, année des indépendances africaines.", "tag": "SA2"}, {"q": "Quand le Dahomey a-t-il été admis à l'ONU ?", "ok": "En septembre 1960", "ko": ["En 1945", "En 1958", "En 1963"], "e": "Le Dahomey, indépendant le 1er août 1960, a été admis à l'ONU en septembre 1960.", "tag": "SA2"}, {"q": "Combien de pays d'Asie et d'Afrique ont participé à la conférence de Bandung (1955) ?", "ok": "29", "ko": ["12", "54", "77"], "e": "Bandung (Indonésie, avril 1955) a réuni 29 pays d'Asie et d'Afrique et a consacré la naissance du Tiers Monde.", "tag": "SA4"}, {"q": "La conférence de Brazzaville s'est tenue en…", "ok": "1944", "ko": ["1936", "1956", "1960"], "e": "Du 30 janvier au 8 février 1944 : réformes promises, mais indépendance et autonomie exclues.", "tag": "SA4"}, {"q": "Quand a été adoptée la loi-cadre Defferre ?", "ok": "Le 23 juin 1956", "ko": ["Le 27 octobre 1946", "Le 28 septembre 1958", "Le 1er août 1960"], "e": "La loi-cadre du 23 juin 1956 accorde le collège unique, le suffrage universel et des conseils de gouvernement.", "tag": "SA4"}, {"q": "Quel territoire a voté « non » au référendum du 28 septembre 1958 ?", "ok": "La Guinée", "ko": ["Le Dahomey", "Le Sénégal", "La Côte d'Ivoire"], "e": "La Guinée de Sékou Touré a voté « non » et est devenue indépendante le 2 octobre 1958.", "tag": "SA4"}, {"q": "À quelle date le Dahomey est-il devenu indépendant ?", "ok": "Le 1er août 1960", "ko": ["Le 4 décembre 1958", "Le 14 février 1959", "Le 11 juillet 1960"], "e": "Le 4 décembre 1958 : République autonome ; le 1er août 1960 : indépendance.", "tag": "SA4"}, {"q": "Qui fut le premier président du Dahomey indépendant ?", "ok": "Hubert Maga", "ko": ["Sourou Migan Apithy", "Mathieu Kérékou", "Nicéphore Soglo"], "e": "Hubert Maga est chef du gouvernement en 1959 puis premier président (1960-1963).", "tag": "SA4"}, {"q": "Quel événement survient en octobre 1963 au Dahomey ?", "ok": "Le premier coup d'État du colonel Soglo", "ko": ["L'indépendance", "La Conférence nationale", "Le coup d'État de Kérékou"], "e": "Le colonel Christophe Soglo renverse Maga en octobre 1963 : c'est le début d'une décennie d'instabilité.", "tag": "SA4"}, {"q": "À quelle date Mathieu Kérékou prend-il le pouvoir ?", "ok": "Le 26 octobre 1972", "ko": ["Le 28 octobre 1963", "En décembre 1967", "En février 1990"], "e": "Le coup d'État du commandant Kérékou a lieu le 26 octobre 1972.", "tag": "SA4"}, {"q": "Quand se tient la Conférence nationale des forces vives de la Nation ?", "ok": "En février 1990", "ko": ["En 1972", "En 1975", "En 1991"], "e": "Elle met fin au régime marxiste-léniniste et ouvre la voie au multipartisme.", "tag": "SA4"}, {"q": "Quel roi a résisté à la conquête française du Dahomey entre 1892 et 1894 ?", "ok": "Béhanzin", "ko": ["Hubert Maga", "Toussaint Louverture", "Sékou Touré"], "e": "Béhanzin, roi d'Abomey, a mené la guerre de résistance avant d'être vaincu et déporté.", "tag": "SA4"}, {"q": "Quel est le premier produit d'exportation du Bénin ?", "ok": "Le coton", "ko": ["Le cacao", "Le pétrole", "L'anacarde"], "e": "Le coton est le produit d'exportation majeur, ce qui entretient la dépendance du pays.", "tag": "SA1"}, {"q": "Avec quel pays voisin le Bénin a-t-il un lien commercial particulièrement fort ?", "ok": "Le Nigeria", "ko": ["Le Ghana", "Le Cameroun", "La Côte d'Ivoire"], "e": "Le port de Cotonou alimente le commerce de transit vers le Nigeria et l'hinterland.", "tag": "SA1"}, {"q": "Une économie dominée se caractérise surtout par…", "ok": "Sa dépendance de l'extérieur pour ses revenus et ses produits manufacturés", "ko": ["Une forte industrie de haute technologie", "Un contrôle du commerce mondial", "L'absence totale d'agriculture"], "e": "Une économie dominée exporte surtout des matières premières et importe des produits finis.", "tag": "SA1"}, {"q": "Sur quelle façade l'industrie japonaise est-elle surtout concentrée ?", "ok": "La façade pacifique", "ko": ["La façade de la mer du Japon", "L'île de Hokkaido", "L'intérieur montagneux"], "e": "Tokyo, Osaka et Nagoya sont les grands pôles industriels de la façade pacifique.", "tag": "SA3"}, {"q": "Quel est le principal atout humain du Japon ?", "ok": "Une population nombreuse, instruite et disciplinée", "ko": ["Des ressources minières abondantes", "Un vaste territoire agricole", "Une faible population"], "e": "Le Japon est pauvre en ressources mais compense par la formation, la discipline et l'organisation.", "tag": "SA3"}, {"q": "Qui lance les réformes de 1978 en Chine ?", "ok": "Deng Xiaoping", "ko": ["Mao Zedong", "Sun Yat-sen", "Xi Jinping"], "e": "Les réformes de 1978 ouvrent l'économie chinoise (zones économiques spéciales, investissements étrangers).", "tag": "SA5"}, {"q": "Quelle ville chinoise est citée comme zone économique spéciale ?", "ok": "Shenzhen", "ko": ["Lhassa", "Pékin", "Urumqi"], "e": "Shenzhen est la première grande zone économique spéciale, ouverte aux capitaux étrangers.", "tag": "SA5"}, {"q": "En quelle année la Chine entre-t-elle à l'OMC ?", "ok": "2001", "ko": ["1978", "1990", "2015"], "e": "L'entrée à l'OMC en 2001 renforce sa puissance commerciale.", "tag": "SA5"}, {"q": "Le Brésil et la Chine sont tous deux…", "ok": "Membres des BRICS", "ko": ["Membres de la CEDEAO", "Membres du Conseil de sécurité en tant que non-permanents à vie", "Des pays à économie dominée"], "e": "BRICS : Brésil, Russie, Inde, Chine, Afrique du Sud.", "tag": "SA5"}, {"q": "Où et quand la CEDEAO a-t-elle été créée ?", "ok": "À Lagos, le 28 mai 1975", "ko": ["À Cotonou, en 1993", "À Abuja, en 1991", "À Lomé, en 1979"], "e": "Le traité de Lagos (1975) a créé la CEDEAO ; le traité révisé date de 1993 à Cotonou.", "tag": "SA6"}, {"q": "Où se trouve le siège de la Commission de la CEDEAO ?", "ok": "Abuja (Nigeria)", "ko": ["Lomé (Togo)", "Cotonou (Bénin)", "Dakar (Sénégal)"], "e": "La Commission, organe exécutif, siège à Abuja ; la BIDC est à Lomé.", "tag": "SA6"}, {"q": "Quelle institution de la CEDEAO a son siège à Lomé ?", "ok": "La BIDC", "ko": ["L'OOAS", "La Commission", "Le Parlement"], "e": "La BIDC (banque d'investissement) est à Lomé ; l'OOAS est à Bobo-Dioulasso.", "tag": "SA6"}, {"q": "Quels pays ont quitté la CEDEAO en 2025 ?", "ok": "Le Mali, le Burkina Faso et le Niger", "ko": ["Le Ghana, le Togo et le Bénin", "Le Nigeria, la Guinée et le Libéria", "Le Sénégal, la Gambie et la Guinée-Bissau"], "e": "Ces trois pays ont annoncé leur retrait, effectif en 2025.", "tag": "SA6"}, {"q": "Quel protocole de la CEDEAO concerne la libre circulation des personnes ?", "ok": "Celui de 1979", "ko": ["Celui de 1945", "Celui de 1960", "Celui de 2001"], "e": "Le protocole de 1979 pose le principe de la libre circulation dans l'espace CEDEAO.", "tag": "SA6"}, {"q": "Dans quel ordre croissant d'intégration classe-t-on ces regroupements ?", "ok": "Libre-échange, union douanière, marché commun, union économique et monétaire", "ko": ["Union économique, marché commun, union douanière, libre-échange", "Marché commun, libre-échange, union monétaire, union douanière", "Union douanière, union monétaire, libre-échange, marché commun"], "e": "Chaque niveau ajoute des éléments au précédent, jusqu'à la monnaie commune.", "tag": "SA6"}, {"q": "Quels sont les trois grands pôles industriels japonais de la façade pacifique ?", "ok": "Tokyo, Osaka, Nagoya", "ko": ["Sapporo, Sendai, Niigata", "Kyoto, Hiroshima, Nara", "Okinawa, Kobe, Fukuoka"], "e": "Ces trois pôles concentrent l'essentiel de l'industrie japonaise.", "tag": "SA3"}, {"q": "Lequel de ces problèmes touche l'économie japonaise ?", "ok": "Le vieillissement de la population", "ko": ["Un excès de ressources pétrolières", "Une population trop jeune", "L'absence de concurrence"], "e": "Le vieillissement réduit la main-d'œuvre ; s'ajoutent la dépendance énergétique et la concurrence de la Chine et de la Corée du Sud.", "tag": "SA3"}]}, "cd": {"themes": {"CD-USA": "États-Unis : organisation et puissance économique", "CD-JAP": "Japon : contraintes naturelles, agriculture, environnement", "CD-ENV": "Environnement et développement durable", "CD-DEC": "Décolonisation : formes et exemples (Algérie, Kenya, Ghana, Congo belge, Angola)", "CD-BEN": "Bénin : commerce et échanges", "CD-ONU": "ONU : organes et bilan"}, "fiches": [{"groupe": "CD-USA", "titre": "États-Unis : organisation et puissance économique", "rubrique": "Fondements naturels", "texte": "• Vaste territoire (environ 9,8 millions de km²) ouvert sur l'Atlantique et le Pacifique\n• Relief varié : Appalaches, Rocheuses, grandes plaines fertiles ; grands fleuves (Mississippi, Missouri) et Grands Lacs\n• Climats variés, permettant des productions agricoles diverses\n• Sous-sol riche : charbon, pétrole, gaz, fer, cuivre, or"}, {"groupe": "CD-USA", "titre": "États-Unis : organisation et puissance économique", "rubrique": "Fondements humains et organisationnels", "texte": "• Population nombreuse (plus de 330 millions d'habitants), renouvelée par l'immigration, main-d'œuvre qualifiée\n• Universités, recherche-développement, pôles de haute technologie (Silicon Valley)\n• Grandes firmes multinationales, puissance financière (dollar, Wall Street), vaste marché intérieur, libéralisme économique"}, {"groupe": "CD-USA", "titre": "États-Unis : organisation et puissance économique", "rubrique": "Secteur secondaire", "texte": "• Première puissance industrielle : automobile, aéronautique et spatial, électronique, informatique, pétrochimie\n• Régions industrielles : Nord-Est (Manufacturing Belt), Californie, Texas, Floride (Sun Belt)"}, {"groupe": "CD-USA", "titre": "États-Unis : organisation et puissance économique", "rubrique": "Agriculture, l'« arme verte »", "texte": "• Grande puissance agricole et exportatrice : maïs, blé, soja, coton, élevage\n• Facteurs : grandes exploitations, mécanisation, engrais, biotechnologies, agrobusiness, soutien de l'État\n• Revers : érosion des sols, pollution par engrais et pesticides, baisse des nappes d'eau, monoculture"}, {"groupe": "CD-USA", "titre": "États-Unis : organisation et puissance économique", "rubrique": "Secteur tertiaire", "texte": "• Environ 4/5 du PIB\n• Finance (Wall Street), commerce, transport aérien et maritime, tourisme, numérique, services aux entreprises"}, {"groupe": "CD-USA", "titre": "États-Unis : organisation et puissance économique", "rubrique": "Difficultés et limites", "texte": "• Croissance moins forte qu'autrefois, forte dette publique et privée, déficit commercial\n• Inégalités sociales, coût de la santé, concurrence de la Chine et d'autres pays émergents\n• Environnement : pollution de l'air et de l'eau, émissions de gaz à effet de serre, déchets, catastrophes climatiques"}, {"groupe": "CD-JAP", "titre": "Japon : contraintes naturelles, agriculture, environnement", "rubrique": "Contraintes naturelles", "texte": "• Relief montagneux : environ les trois quarts du territoire, peu d'espace utile\n• Risques naturels : séismes (Kobé, 1995), tsunamis (mars 2011, accident nucléaire de Fukushima), typhons, volcans\n• Archipel morcelé (Honshu est la plus grande île) ; froid et neige au nord\n• Sols peu fertiles, sous-sol pauvre : forte dépendance énergétique et minière\n• Courants marins : Kuro Shivo (chaud) et Oya Shivo (froid) bordent les côtes, favorables à la pêche"}, {"groupe": "CD-JAP", "titre": "Japon : contraintes naturelles, agriculture, environnement", "rubrique": "Agriculture et pêche", "texte": "• Petites parcelles très intensives : riz, thé, légumes, fruits\n• Facteurs de réussite : engrais, mécanisation, recherche, coopératives, formation des agriculteurs\n• Pêche parmi les premières du monde\n• Limites : peu de terres cultivables, vieillissement des agriculteurs, forte dépendance aux importations alimentaires\n• Leçons pour le Bénin : intensifier, former, organiser les producteurs en coopératives, investir dans la recherche"}, {"groupe": "CD-JAP", "titre": "Japon : contraintes naturelles, agriculture, environnement", "rubrique": "Nuisances de l'industrie", "texte": "• Pollution de l'air et de l'eau, déchets, accident nucléaire de Fukushima\n• Réponses : normes environnementales, recyclage, technologies propres, économies d'énergie"}, {"groupe": "CD-ENV", "titre": "Environnement et développement durable", "rubrique": "Nuisances environnementales de l'industrie", "texte": "• Air : gaz, poussières, pluies acides\n• Eau et sols : rejets et déchets industriels\n• Climat : gaz à effet de serre et réchauffement\n• Santé et biodiversité : maladies, destruction d'habitats"}, {"groupe": "CD-ENV", "titre": "Environnement et développement durable", "rubrique": "Principe pollueur-payeur", "texte": "• Principe défini par l'OCDE (1972) : le pollueur prend en charge le coût des mesures de prévention et de lutte contre la pollution\n• Intérêt : responsabilise les entreprises et les particuliers, finance la protection de l'environnement\n• Limites : connaissance et application encore insuffisantes, surtout hors des grandes villes"}, {"groupe": "CD-ENV", "titre": "Environnement et développement durable", "rubrique": "Solutions", "texte": "• Normes et contrôles\n• Recyclage et énergies propres\n• Sensibilisation et éducation\n• Taxes et sanctions\n• Coopération internationale"}, {"groupe": "CD-DEC", "titre": "Décolonisation : formes et exemples (Algérie, Kenya, Ghana, Congo belge, Angola)", "rubrique": "Formes de décolonisation", "texte": "• Pacifique ou négociée : Ghana (1957), colonies françaises d'Afrique noire dont le Dahomey\n• Violente : Algérie, Kenya, Angola\n• Précipitée et conflictuelle : Congo belge (1960)"}, {"groupe": "CD-DEC", "titre": "Décolonisation : formes et exemples (Algérie, Kenya, Ghana, Congo belge, Angola)", "rubrique": "Conditions de la décolonisation violente", "texte": "• Forte présence de colons hostiles à l'indépendance\n• Volonté de la métropole de garder sa domination\n• Expropriation des terres et abus coloniaux (impôts, travail forcé, discrimination)\n• Refus des revendications des nationalistes\n• Cultures de rente imposées au détriment des cultures vivrières"}, {"groupe": "CD-DEC", "titre": "Décolonisation : formes et exemples (Algérie, Kenya, Ghana, Congo belge, Angola)", "rubrique": "Algérie (1954-1962)", "texte": "• 1er novembre 1954 : début de l'insurrection du FLN\n• 13 mai 1958 : crise d'Alger et retour de de Gaulle\n• 16 septembre 1959 : droit à l'autodétermination reconnu aux Algériens\n• 1961 : putsch des généraux à Alger (avril), terrorisme de l'OAS\n• 18 mars 1962 : accords d'Évian ; 19 mars : cessez-le-feu\n• 1er juillet 1962 : référendum ; indépendance reconnue le 3 juillet et proclamée le 5 juillet 1962 ; Ahmed Ben Bella premier chef du gouvernement puis président"}, {"groupe": "CD-DEC", "titre": "Décolonisation : formes et exemples (Algérie, Kenya, Ghana, Congo belge, Angola)", "rubrique": "Ghana", "texte": "• Ancienne Côte-de-l'Or britannique\n• Kwame Nkrumah et le Convention People's Party : grèves, boycotts, actions non violentes\n• 6 mars 1957 : premier pays d'Afrique noire indépendant, modèle pour les autres colonies"}, {"groupe": "CD-DEC", "titre": "Décolonisation : formes et exemples (Algérie, Kenya, Ghana, Congo belge, Angola)", "rubrique": "Kenya", "texte": "• Terres prises par les colons européens, en particulier chez les Kikuyu\n• 1952 : révolte des Mau-Mau, état d'urgence, répression britannique ; arrestation de Jomo Kenyatta\n• 12 décembre 1963 : indépendance ; Kenyatta chef du gouvernement puis président"}, {"groupe": "CD-DEC", "titre": "Décolonisation : formes et exemples (Algérie, Kenya, Ghana, Congo belge, Angola)", "rubrique": "Congo belge", "texte": "• Indépendance le 30 juin 1960 : Patrice Lumumba Premier ministre, Joseph Kasa-Vubu président\n• Crise immédiate : mutinerie, sécession du Katanga, intervention de l'ONU\n• 17 janvier 1961 : assassinat de Lumumba"}, {"groupe": "CD-DEC", "titre": "Décolonisation : formes et exemples (Algérie, Kenya, Ghana, Congo belge, Angola)", "rubrique": "Angola", "texte": "• Colonie portugaise ; refus du Portugal de reconnaître l'indépendance\n• 1961 : début de la lutte armée ; mouvements de libération MPLA, FNLA, UNITA\n• 1974 : révolution des Œillets au Portugal ; 11 novembre 1975 : indépendance, suivie d'une guerre civile"}, {"groupe": "CD-BEN", "titre": "Bénin : commerce et échanges", "rubrique": "Atouts du commerce béninois", "texte": "• Position sur le golfe de Guinée et proximité du Nigeria (grand marché)\n• Port autonome de Cotonou et corridors routiers vers le Niger, le Burkina Faso, le Mali\n• Grands marchés (Dantokpa), appartenance à la CEDEAO et à l'UEMOA"}, {"groupe": "CD-BEN", "titre": "Bénin : commerce et échanges", "rubrique": "Problèmes du commerce béninois", "texte": "• Commerce informel et réexportation dépendant de la politique du Nigeria (exemple : fermeture des frontières terrestres de 2019 à 2020)\n• Fraude et concurrence déloyale, lourdeurs administratives, coût du transport, faible transformation locale"}, {"groupe": "CD-ONU", "titre": "ONU : organes et bilan", "rubrique": "Organes principaux de l'ONU", "texte": "• Assemblée générale : tous les États membres, un État une voix, débat et recommandations\n• Conseil de sécurité : 15 membres dont 5 permanents avec veto\n• Secrétariat : dirigé par le Secrétaire général\n• Cour internationale de justice (La Haye) : règle les différends entre États\n• Conseil économique et social (ECOSOC) : coordination économique et sociale\n• Conseil de tutelle : activité suspendue depuis 1994"}, {"groupe": "CD-ONU", "titre": "ONU : organes et bilan", "rubrique": "Bilan de l'ONU", "texte": "• Réussites : évite une nouvelle guerre mondiale, casques bleus, décolonisation, droits de l'homme, aide humanitaire\n• Limites : veto, manque de moyens, conflits non résolus, inégalités entre pays riches et pays pauvres\n• Réformes demandées : élargir le Conseil de sécurité, mieux représenter l'Afrique"}, {"groupe": "CD-DEC", "titre": "Décolonisation : formes et exemples (Algérie, Kenya, Ghana, Congo belge, Angola)", "rubrique": "La conférence de Bandung (1955)", "texte": "• Avril 1955, en Indonésie : 29 pays d'Asie et d'Afrique\n• Condamnation du colonialisme, coexistence pacifique, non-alignement\n• Naissance du Tiers Monde\n• Encourage les nationalistes africains et renforce la pression sur l'ONU"}, {"groupe": "CD-DEC", "titre": "Décolonisation : formes et exemples (Algérie, Kenya, Ghana, Congo belge, Angola)", "rubrique": "Dates des indépendances à retenir", "texte": "• Ghana : 6 mars 1957\n• Guinée : 2 octobre 1958\n• Dahomey : 1er août 1960\n• Congo belge : 30 juin 1960\n• Algérie : indépendance reconnue le 3 juillet et proclamée le 5 juillet 1962\n• Kenya : 12 décembre 1963\n• Angola : 11 novembre 1975"}, {"groupe": "CD-ONU", "titre": "ONU : organes et bilan", "rubrique": "Agences et sigles (sièges)", "texte": "• PAM : Programme alimentaire mondial (Rome)\n• FAO : alimentation et agriculture (Rome)\n• OMS : Organisation mondiale de la santé (Genève)\n• UNESCO : éducation, science et culture (Paris)\n• UNICEF : enfance (New York)\n• HCR : réfugiés (Genève)"}, {"groupe": "CD-USA", "titre": "États-Unis : organisation et puissance économique", "rubrique": "Régions et pôles à connaître", "texte": "• Manufacturing Belt : Nord-Est, industries traditionnelles\n• Sun Belt : Californie, Texas, Floride, industries nouvelles et pétrole\n• Silicon Valley (Californie) : haute technologie et numérique\n• Corn Belt : maïs ; Wheat Belt : blé\n• Wall Street (New York) : finance"}, {"groupe": "CD-JAP", "titre": "Japon : contraintes naturelles, agriculture, environnement", "rubrique": "L'industrie japonaise", "texte": "• Branches phares : automobile, construction navale, électronique, robotique, sidérurgie, chimie\n• Organisation : grandes firmes liées aux banques (keiretsu), sociétés de commerce (sôgo shosha), réseau de sous-traitants, coopération État-entreprises\n• Localisation : façade pacifique (Tokyo, Osaka, Nagoya)"}], "epreuves": [{"id": "CD1", "num": "1", "parts": [{"partie": "Histoire", "type": "Dissertation", "sa": "Thème : décolonisation", "contexte": "Selon la nature de la puissance coloniale et les intérêts en jeu, la décolonisation a pu être pacifique ou violente.", "tache": "Pour montrer ta maîtrise de ce fait historique, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Expose les conditions dans lesquelles intervient la forme violente de la décolonisation en Afrique.", "Présente les causes et le déclenchement de la guerre d'Algérie (1954).", "Retrace les étapes de la fin de la guerre de 1958 à 1962."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : après la Seconde Guerre mondiale, de vastes mouvements d'indépendance touchent l'Afrique\n• Problématique : la décolonisation violente a marqué l'Algérie, dernier grand conflit colonial de la France\n• Plan : conditions, causes et déclenchement, fin de la guerre"}, {"label": "Consigne 1", "points": 3, "text": "• Forte présence de colons hostiles à l'indépendance (Algérie, Kenya, Rhodésie du Sud)\n• Volonté de la métropole de maintenir sa domination\n• Expropriation des terres et abus coloniaux (impôts, travail forcé, discrimination)\n• Refus des revendications des nationalistes\n• Cultures de rente imposées au détriment des cultures vivrières\n• Transition : l'Algérie illustre ces conditions"}, {"label": "Consigne 2", "points": 3, "text": "• Algérie considérée comme une partie de la France, avec un statut d'inégalité entre colons et Algériens\n• Répression de 1945 (Sétif), échec des voies légales, montée du nationalisme\n• Défaite de la France en Indochine (1954) qui encourage les nationalistes\n• 1er novembre 1954 : le FLN déclenche l'insurrection\n• Transition : la guerre s'étend et s'intensifie"}, {"label": "Consigne 3", "points": 3, "text": "• 13 mai 1958 : crise d'Alger, retour de de Gaulle au pouvoir\n• Échec de la victoire militaire, 16 septembre 1959 : droit à l'autodétermination\n• Avril 1961 : putsch des généraux ; terrorisme de l'OAS\n• 18 mars 1962 : accords d'Évian, cessez-le-feu le 19\n• 1er juillet 1962 : référendum ; indépendance reconnue le 3 juillet, proclamée le 5 juillet"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : une guerre longue et meurtrière a conduit à l'indépendance de l'Algérie\n• Ouverture : conséquences pour les deux pays et pour la décolonisation africaine"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "Thème : Japon", "contexte": "Le Japon est une grande puissance économique bien qu'il subisse de fortes contraintes naturelles.", "tache": "Pour expliquer la performance économique du Japon, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Expose les contraintes d'ordre naturel auxquelles le Japon est confronté.", "Présente les atouts humains et organisationnels de sa réussite.", "Détermine les limites de la performance industrielle japonaise sur le plan environnemental."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : le Japon, archipel d'Asie de l'Est, est l'une des premières économies du monde\n• Problématique : le pays a surmonté des contraintes naturelles grâce à ses atouts, mais son industrie a des limites environnementales\n• Plan : contraintes, atouts, limites"}, {"label": "Consigne 1", "points": 3, "text": "• Territoire montagneux (environ 3/4) : peu d'espace utile\n• Séismes (Kobé, 1995), tsunamis (2011) et accident de Fukushima, typhons, volcans\n• Archipel morcelé, froid et neige au nord\n• Sols peu fertiles et sous-sol pauvre : dépendance énergétique et minière\n• Transition : malgré ces contraintes, le pays a su se développer"}, {"label": "Consigne 2", "points": 3, "text": "• Humains : population nombreuse, instruite et disciplinée, forte épargne, faible absentéisme\n• Organisationnels : grandes firmes liées aux banques, sociétés de commerce, réseau de sous-traitants, coopération État-entreprises, cercles de qualité\n• Résultat : premières places dans l'automobile, l'électronique, la robotique et la construction navale\n• Transition : cette réussite a un coût"}, {"label": "Consigne 3", "points": 3, "text": "• Pollution de l'air et de l'eau, déchets industriels\n• Consommation énergétique élevée et émissions de gaz à effet de serre\n• Risques nucléaires (Fukushima)\n• Réponses : normes, recyclage, technologies propres, énergies renouvelables"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : le Japon montre qu'organisation et formation compensent la pauvreté en ressources\n• Ouverture : la question du développement durable"}]}]}, {"id": "CD2", "num": "2", "parts": [{"partie": "Histoire", "type": "Commentaire de texte", "sa": "Thème : ONU", "contexte": "Après des décennies d'existence, l'ONU dresse un bilan de son action et s'interroge sur ses perspectives.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer les réussites et les limites de l'ONU.", "support": "Texte (rédigé pour l'exercice) : « Depuis 1945, l'ONU a contribué à éviter une nouvelle guerre mondiale, elle a accompagné les peuples colonisés vers l'indépendance et défendu les droits de l'homme. Ses agences luttent contre la faim, la maladie et l'analphabétisme. Pourtant, le monde connaît encore des guerres dans lesquelles l'Organisation intervient trop tard ou pas du tout. Le droit de veto des cinq membres permanents du Conseil de sécurité bloque souvent les décisions, et l'écart entre pays riches et pays pauvres continue de se creuser. Pour rester utile, l'ONU doit se réformer. »", "consignes": ["Présente le texte.", "Explique le bilan positif et négatif de l'ONU dressé dans le texte.", "Porte un jugement critique sur l'idée que l'ONU doit se réformer.", "Dégage l'intérêt et la portée du texte."], "elements": [{"label": "Consigne 1 : Présentation du texte", "points": 2, "text": "• Nature : analyse (texte de bilan)\n• Source : texte rédigé pour l'exercice\n• Auteur : un observateur des relations internationales\n• Destinataires : opinion publique, États membres\n• Contexte : monde d'après la guerre froide, débat sur le rôle de l'ONU\n• Idée générale : l'ONU a un bilan contrasté et doit se réformer\n• Centres d'intérêt : 1) les réussites, 2) les échecs et le veto, 3) la nécessité de réformes"}, {"label": "Consigne 2 : Explication", "points": 3, "text": "• Réussites : pas de guerre mondiale depuis 1945, casques bleus, décolonisation, Déclaration universelle des droits de l'homme (1948), actions du PAM, de l'OMS, de l'UNESCO\n• Échecs : conflits non résolus, veto qui paralyse le Conseil, manque de moyens, inégalités persistantes"}, {"label": "Consigne 3 : Jugement critique", "points": 3, "text": "• Le texte est clair et équilibré\n• Il a raison sur le veto, qui contredit l'égalité des États\n• Mais certaines réformes (élargissement du Conseil) sont difficiles car les permanents refusent de perdre leurs privilèges\n• Les échecs tiennent aussi au manque de volonté des États, pas seulement à l'institution"}, {"label": "Consigne 4 : Intérêt et portée", "points": 2, "text": "• Intérêt : présente un bilan honnête de l'ONU\n• Portée : nourrit les débats sur la réforme du Conseil de sécurité et sur la place de l'Afrique"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "Thème : États-Unis", "contexte": "Grâce à de nombreux fondements, les États-Unis se sont dotés d'une économie puissante, qui n'est pas exempte de faiblesses.", "tache": "Pour expliquer la puissance de l'économie américaine, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les fondements naturels du développement économique des États-Unis.", "Expose les aspects de leur puissance dans le secteur tertiaire.", "Identifie les difficultés de l'économie américaine sur le plan environnemental."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : les États-Unis sont la première puissance économique mondiale\n• Problématique : leur puissance repose sur de solides atouts mais entraîne des nuisances\n• Plan : fondements naturels, tertiaire, difficultés environnementales"}, {"label": "Consigne 1", "points": 3, "text": "• Vaste territoire ouvert sur deux océans\n• Plaines fertiles, grands fleuves (Mississippi, Missouri), Grands Lacs\n• Climats variés\n• Sous-sol riche : charbon, pétrole, gaz, fer, cuivre\n• Transition : ces atouts ont nourri un tertiaire puissant"}, {"label": "Consigne 2", "points": 3, "text": "• Le tertiaire représente environ 4/5 du PIB\n• Finance : Wall Street, dollar, grandes banques\n• Commerce international et transport aérien et maritime\n• Tourisme et services aux entreprises\n• Numérique et haute technologie\n• Transition : cette puissance a un coût environnemental"}, {"label": "Consigne 3", "points": 3, "text": "• Pollution de l'air par l'industrie et les transports\n• Émissions de gaz à effet de serre parmi les plus élevées du monde\n• Pollution de l'eau et des sols, déchets\n• Catastrophes climatiques (ouragans, sécheresses)\n• Solutions possibles : énergies renouvelables, normes, recyclage"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : puissance réelle mais fragilisée par ses nuisances\n• Ouverture : la recherche d'un développement durable"}]}]}, {"id": "CD3", "num": "3", "parts": [{"partie": "Histoire", "type": "Réponds directement aux consignes", "sa": "Thème : ONU", "contexte": "L'ONU fonctionne à partir de plusieurs organes qui ont chacun un rôle précis.", "tache": "Réponds directement aux consignes suivantes.", "support": "", "consignes": ["Cite les six organes principaux de l'ONU.", "Explique le rôle de l'Assemblée générale et du Secrétariat.", "Donne ton opinion sur la nécessité de réformer l'ONU."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Assemblée générale\n• Conseil de sécurité\n• Secrétariat\n• Cour internationale de justice\n• Conseil économique et social (ECOSOC)\n• Conseil de tutelle (activité suspendue depuis 1994)"}, {"label": "Consigne 2", "points": 3, "text": "• Assemblée générale : réunit tous les États membres (un État, une voix), débat de toutes les questions, adopte le budget, vote des recommandations\n• Secrétariat : administration de l'ONU dirigée par le Secrétaire général, qui applique les décisions et peut proposer sa médiation"}, {"label": "Consigne 3", "points": 4, "text": "• La réforme est nécessaire : le Conseil de sécurité reflète le monde de 1945, le veto bloque certaines décisions, l'Afrique et l'Amérique latine sont peu représentées\n• Elle est difficile : les membres permanents ne veulent pas perdre leurs privilèges\n• Propositions : élargir le Conseil, limiter l'usage du veto"}]}, {"partie": "Géographie", "type": "Commentaire de texte", "sa": "Thème : États-Unis", "contexte": "Malgré sa puissance, l'économie américaine connaît des limites qui inquiètent ses dirigeants.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer l'état de l'économie américaine.", "support": "Texte (rédigé pour l'exercice) : « L'économie américaine croît depuis longtemps, mais à un rythme plus lent qu'autrefois. Le chômage est faible, mais une partie des travailleurs peu qualifiés a quitté le marché du travail. Beaucoup de ménages ont peu d'épargne, et l'endettement des entreprises et de l'État est élevé. Les entreprises manquent de main-d'œuvre qualifiée et la concurrence de la Chine pèse sur l'industrie. Pour y répondre, le gouvernement a baissé certains impôts et relevé des droits de douane. »", "consignes": ["Présente le texte.", "Décris les limites de la croissance économique des États-Unis.", "Expose les facteurs qui expliquent cette situation.", "Montre les conséquences liées à ces limites.", "Donne ton point de vue sur le recours aux droits de douane pour protéger l'industrie nationale."], "elements": [{"label": "Consigne 1", "points": 2, "text": "• Nature : texte explicatif (analyse économique)\n• Source : texte rédigé pour l'exercice\n• Cadre géographique : États-Unis, pays à économie dominante\n• Idée générale : une croissance réelle mais fragile\n• Centres d'intérêt : 1) croissance lente et chômage trompeur, 2) endettement et manque de main-d'œuvre qualifiée, 3) réponses du gouvernement"}, {"label": "Consigne 2", "points": 2, "text": "• Croissance plus lente que lors des décennies précédentes\n• Faible taux de chômage mais sortie du marché du travail de travailleurs découragés\n• Épargne faible des ménages\n• Endettement élevé des entreprises et de l'État"}, {"label": "Consigne 3", "points": 2, "text": "• Manque de main-d'œuvre qualifiée\n• Faible pouvoir d'achat d'une partie de la population\n• Poids de la dette et faiblesse de l'investissement\n• Concurrence de la Chine et des pays émergents\n• Effets de la crise financière de 2008 et fluctuations du dollar"}, {"label": "Consigne 4", "points": 2, "text": "• Déficit de la balance commerciale\n• Perte de compétitivité face aux pays émergents\n• Inégalités et fragilité sociale\n• Recul de l'influence économique"}, {"label": "Consigne 5", "points": 2, "text": "• Point de vue argumenté : les droits de douane protègent certaines industries et emplois à court terme, mais ils renchérissent les produits, risquent des représailles et ne règlent pas les problèmes de fond (formation, innovation, dette)"}]}]}, {"id": "CD4", "num": "4", "parts": [{"partie": "Histoire", "type": "Dissertation", "sa": "Thème : décolonisation", "contexte": "La décolonisation de l'Afrique a pris des formes différentes selon les puissances coloniales et les territoires.", "tache": "Pour montrer la diversité des formes de décolonisation, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente la décolonisation pacifique du Ghana.", "Expose la guerre de libération du Kenya.", "Explique les difficultés du Congo belge au lendemain de l'indépendance de 1960."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : les colonies britanniques, françaises et belges n'ont pas suivi le même chemin vers l'indépendance\n• Problématique : Ghana, Kenya et Congo belge illustrent trois formes différentes\n• Plan : le Ghana, le Kenya, le Congo"}, {"label": "Consigne 1", "points": 3, "text": "• Ancienne Côte-de-l'Or britannique, rôle de Kwame Nkrumah et du Convention People's Party\n• Grèves, boycotts et actions non violentes\n• Réformes constitutionnelles progressives et négociations avec Londres\n• 6 mars 1957 : indépendance, premier État d'Afrique noire indépendant, modèle pour les autres colonies\n• Transition : ailleurs, la résistance des colons a mené à la violence"}, {"label": "Consigne 2", "points": 3, "text": "• Terres prises par les colons européens, surtout chez les Kikuyu\n• Révolte des Mau-Mau à partir de 1952, état d'urgence et répression britannique\n• Arrestation de Jomo Kenyatta\n• Pression internationale et négociations ; 12 décembre 1963 : indépendance\n• Transition : le cas du Congo belge montre les risques d'une indépendance précipitée"}, {"label": "Consigne 3", "points": 3, "text": "• 30 juin 1960 : indépendance, Lumumba Premier ministre et Kasa-Vubu président\n• Faible préparation de l'administration et des cadres africains\n• Mutinerie de la Force publique, sécession du Katanga, rivalités politiques\n• Intervention de l'ONU ; 17 janvier 1961 : assassinat de Lumumba"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : trois formes de décolonisation (pacifique, violente, précipitée)\n• Ouverture : les défis des États indépendants"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "Thème : Bénin, commerce", "contexte": "Grâce à sa position géographique, le Bénin dispose d'atouts commerciaux, mais son commerce reste fragile.", "tache": "Pour expliquer la situation du commerce béninois, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les atouts du commerce béninois.", "Détermine les problèmes auxquels il est confronté.", "Propose des solutions pour le renforcer."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : le Bénin, pays côtier, joue un rôle de carrefour commercial en Afrique de l'Ouest\n• Problématique : le commerce béninois a des atouts mais reste fragile\n• Plan : atouts, problèmes, solutions"}, {"label": "Consigne 1", "points": 3, "text": "• Position géographique sur le golfe de Guinée, proximité du Nigeria\n• Port autonome de Cotonou et corridors vers le Niger, le Burkina Faso et le Mali\n• Grands marchés (Dantokpa) et tradition commerciale\n• Appartenance à la CEDEAO et à l'UEMOA\n• Transition : ces atouts sont limités par plusieurs problèmes"}, {"label": "Consigne 2", "points": 3, "text": "• Dépendance vis-à-vis du Nigeria (exemple : fermeture des frontières terrestres de 2019 à 2020)\n• Poids du commerce informel et de la réexportation\n• Fraude et concurrence déloyale\n• Lourdeurs administratives et coût du transport\n• Faible transformation locale des produits exportés"}, {"label": "Consigne 3", "points": 3, "text": "• Diversifier les partenaires et les produits\n• Moderniser le port et les corridors, simplifier les procédures\n• Formaliser le commerce informel\n• Transformer sur place les produits agricoles\n• Renforcer les accords de la CEDEAO"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : le commerce peut devenir un moteur du développement si les obstacles sont levés\n• Ouverture : intégration régionale"}]}]}, {"id": "CD5", "num": "5", "parts": [{"partie": "Histoire", "type": "Commentaire de texte", "sa": "Thème : décolonisation (Algérie)", "contexte": "En 1959, alors que la guerre d'Algérie se poursuit, la France change de position sur l'avenir du pays.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer l'attitude de la France face à la décolonisation de l'Algérie.", "support": "Texte (adapté d'un discours du général de Gaulle, 16 septembre 1959) : « Les Algériens décideront eux-mêmes de leur avenir, par un vote libre, quand la paix sera revenue. Ils pourront choisir de rompre avec la France, de s'unir étroitement à elle ou de rester en association avec elle. Le gouvernement s'engage à respecter leur choix. En attendant, l'armée continuera de rétablir l'ordre. »", "consignes": ["Présente le texte.", "Explique les idées développées par l'auteur.", "Porte un jugement critique sur cette position.", "Dégage l'intérêt et la portée du texte."], "elements": [{"label": "Consigne 1 : Présentation du texte", "points": 2, "text": "• Nature : discours politique (extrait adapté)\n• Auteur : Charles de Gaulle, président de la République française\n• Destinataires : Algériens, Français, opinion internationale\n• Contexte : guerre d'Algérie (depuis 1954), retour de de Gaulle en 1958\n• Idée générale : reconnaissance du droit des Algériens à choisir leur avenir\n• Centres d'intérêt : 1) l'autodétermination, 2) les trois options, 3) la poursuite des opérations militaires"}, {"label": "Consigne 2 : Explication", "points": 3, "text": "• La France reconnaît pour la première fois le droit des Algériens à l'autodétermination\n• Trois solutions : sécession, association, francisation\n• Le vote aura lieu après le retour de la paix, donc l'armée doit d'abord rétablir l'ordre"}, {"label": "Consigne 3 : Jugement critique", "points": 3, "text": "• Avancée majeure, mais offre ambiguë : les options sont orientées vers le maintien d'un lien avec la France\n• La condition du retour à la paix retarde l'application\n• Le FLN exige des négociations directes et l'indépendance\n• Les partisans de l'Algérie française et l'armée rejettent l'autodétermination (putsch de 1961)"}, {"label": "Consigne 4 : Intérêt et portée", "points": 2, "text": "• Intérêt : marque un tournant de la politique française\n• Portée : ouvre la voie aux négociations, aux accords d'Évian (mars 1962) et à l'indépendance de juillet 1962"}]}, {"partie": "Géographie", "type": "Réponds directement aux consignes", "sa": "Thème : environnement", "contexte": "L'industrialisation apporte la croissance mais aussi des nuisances pour l'environnement.", "tache": "Réponds directement aux consignes suivantes.", "support": "", "consignes": ["Décris les nuisances environnementales de l'industrie.", "Définis le principe « pollueur-payeur » et donne ton point de vue sur ce principe.", "Propose deux solutions pour réduire ces nuisances."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Pollution de l'air (gaz, poussières, pluies acides)\n• Pollution de l'eau et des sols par les rejets et déchets\n• Émissions de gaz à effet de serre et réchauffement\n• Atteintes à la santé et à la biodiversité"}, {"label": "Consigne 2", "points": 3, "text": "• Définition : principe défini par l'OCDE en 1972, selon lequel le pollueur prend en charge le coût des mesures de prévention et de lutte contre la pollution\n• Point de vue : principe juste et utile, car il responsabilise et finance la protection de l'environnement\n• Limite : application encore faible, méconnaissance du principe, contrôle insuffisant en dehors des grandes villes"}, {"label": "Consigne 3", "points": 4, "text": "• Imposer des normes et des contrôles, avec des sanctions\n• Encourager le recyclage, les énergies propres et la sensibilisation"}]}]}, {"id": "CD6", "num": "6", "parts": [{"partie": "Histoire", "type": "Dissertation", "sa": "Thème : décolonisation (Angola)", "contexte": "Le Portugal a longtemps refusé d'accorder l'indépendance à ses colonies d'Afrique.", "tache": "Pour expliquer la décolonisation de l'Angola, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les causes de la guerre d'Angola.", "Décris les mouvements de libération et le déroulement de la lutte.", "Dégage les conséquences de la guerre pour le Portugal et l'Angola."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : le Portugal, puissance coloniale affaiblie mais
