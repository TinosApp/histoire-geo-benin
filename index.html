attachée à son empire\n• Problématique : en Angola, le refus de l'indépendance a entraîné une longue guerre\n• Plan : causes, lutte, conséquences"}, {"label": "Consigne 1", "points": 3, "text": "• Refus du régime portugais d'accorder l'autonomie ou l'indépendance\n• Travail forcé, discrimination, exploitation économique\n• Inégalités entre colons et Africains\n• Influence des indépendances africaines de 1960"}, {"label": "Consigne 2", "points": 3, "text": "• Trois mouvements : MPLA, FNLA, UNITA\n• 1961 : début de la lutte armée\n• Guerre de guérilla, forte présence militaire portugaise\n• Soutiens extérieurs différents selon les mouvements, dans le contexte de la guerre froide"}, {"label": "Consigne 3", "points": 3, "text": "• Portugal : coût humain et financier de la guerre, mécontentement des officiers, révolution des Œillets (25 avril 1974)\n• Angola : indépendance le 11 novembre 1975, puis guerre civile entre mouvements rivaux\n• Conséquences régionales pour les autres colonies portugaises"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : une décolonisation violente et tardive\n• Ouverture : difficultés de la construction nationale après l'indépendance"}]}, {"partie": "Géographie", "type": "Commentaire de texte", "sa": "Thème : Chine", "contexte": "L'industrie chinoise occupe une place importante dans l'économie mondiale.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer l'industrie chinoise.", "support": "Texte (rédigé pour l'exercice) : « Depuis les réformes de 1978, la Chine a bâti une puissante industrie sur son littoral. Les zones économiques spéciales ont attiré les capitaux étrangers, et une main-d'œuvre nombreuse a permis de produire à bas coût. Aujourd'hui, la Chine fabrique une grande partie des textiles, des appareils électroniques et des machines vendus dans le monde. Mais cette réussite a un prix : les usines pollueront l'air et l'eau, les salaires augmentent et les régions de l'intérieur restent en retard. »", "consignes": ["Présente le texte.", "Explique les facteurs de la réussite industrielle de la Chine.", "Expose les aspects de la puissance industrielle chinoise.", "Détermine les limites de cette réussite.", "Donne ton opinion sur l'impact des produits chinois sur l'économie africaine."], "elements": [{"label": "Consigne 1", "points": 2, "text": "• Nature : texte explicatif\n• Source : texte rédigé pour l'exercice\n• Cadre géographique : Chine, pays émergent d'Asie\n• Idée générale : industrialisation rapide mais déséquilibrée\n• Centres d'intérêt : 1) réformes et réussite, 2) coût de cette réussite"}, {"label": "Consigne 2", "points": 2, "text": "• Réformes de 1978 (Deng Xiaoping)\n• Zones économiques spéciales et investissements étrangers\n• Main-d'œuvre nombreuse et peu coûteuse\n• Marché intérieur et politique volontariste de l'État"}, {"label": "Consigne 3", "points": 2, "text": "• Textile, électronique, machines, jouets\n• Une grande part de la production industrielle mondiale\n• Exportations vers tous les continents et grands ports"}, {"label": "Consigne 4", "points": 2, "text": "• Pollution de l'air et de l'eau\n• Hausse des salaires et perte de l'avantage du bas coût\n• Inégalités littoral/intérieur\n• Dépendance aux exportations"}, {"label": "Consigne 5", "points": 2, "text": "• Opinion nuancée : les produits chinois bon marché profitent aux consommateurs africains et facilitent l'équipement, mais ils concurrencent les industries locales et peuvent freiner l'industrialisation ; l'Afrique doit négocier des partenariats avec transfert de technologie"}]}]}, {"id": "CD7", "num": "7", "parts": [{"partie": "Histoire", "type": "Réponds directement aux consignes", "sa": "Thème : décolonisation (Kenya)", "contexte": "Au Kenya, la colonisation britannique a provoqué une résistance armée.", "tache": "Réponds directement aux consignes suivantes.", "support": "", "consignes": ["Présente les causes de la guerre du Kenya.", "Décris les manifestations de cette guerre.", "Donne les conséquences de la guerre sur l'accession du Kenya à l'indépendance."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Terres fertiles prises par les colons européens\n• Inégalités et discrimination raciale\n• Impôts, travail forcé et cultures imposées\n• Frustration des Kikuyu et échec des revendications pacifiques"}, {"label": "Consigne 2", "points": 3, "text": "• Révolte des Mau-Mau à partir de 1952\n• Attaques contre des fermes de colons et des collaborateurs\n• État d'urgence, répression britannique, camps de détention\n• Arrestation de Jomo Kenyatta"}, {"label": "Consigne 3", "points": 4, "text": "• Prise de conscience britannique du coût de la répression\n• Négociations constitutionnelles et pression internationale\n• 12 décembre 1963 : indépendance ; Jomo Kenyatta dirige le pays\n• Départ ou réduction du rôle des colons"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "Thème : Japon (agriculture)", "contexte": "Le Japon dispose de peu de terres cultivables, mais son agriculture est très productive.", "tache": "Pour expliquer les succès agricoles du Japon et les leçons pour le Bénin, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les facteurs de la réussite agricole du Japon.", "Détermine les limites de l'agriculture japonaise.", "Dégage deux leçons que le Bénin peut en tirer."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : le Japon est un archipel montagneux\n• Problématique : malgré peu de terres, l'agriculture japonaise réussit grâce à l'intensification\n• Plan : facteurs de réussite, limites, leçons"}, {"label": "Consigne 1", "points": 3, "text": "• Petites parcelles intensément exploitées (riz, thé, légumes, fruits)\n• Engrais, mécanisation adaptée, recherche agronomique\n• Coopératives et encadrement des agriculteurs\n• Pêche parmi les premières du monde, favorisée par les courants Kuro Shivo et Oya Shivo\n• Transition : cette réussite reste limitée"}, {"label": "Consigne 2", "points": 3, "text": "• Peu de terres cultivables : dépendance aux importations alimentaires (céréales, soja, viande)\n• Vieillissement des agriculteurs et exode rural\n• Coût élevé de la production, risques naturels"}, {"label": "Consigne 3", "points": 3, "text": "• Intensifier et former les producteurs\n• Organiser les paysans en coopératives et investir dans la recherche"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : l'agriculture japonaise est un modèle d'intensification malgré ses limites\n• Ouverture : adapter ces leçons aux réalités béninoises"}]}]}, {"id": "CD8", "num": "8", "parts": [{"partie": "Histoire", "type": "Commentaire de texte", "sa": "Thème : décolonisation (Bandung)", "contexte": "En avril 1955, des pays d'Asie et d'Afrique se réunissent à Bandung pour défendre leurs intérêts communs.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer l'apport de la conférence de Bandung à la décolonisation.", "support": "Texte (adapté du communiqué final de la conférence de Bandung, avril 1955) : « La conférence condamne le colonialisme sous toutes ses formes, affirme l'égalité de toutes les races et de toutes les nations, et demande le respect des droits fondamentaux de l'homme. Elle appelle à la coopération économique et culturelle entre pays d'Asie et d'Afrique et déclare que la paix mondiale exige la coexistence pacifique et le droit des peuples à disposer d'eux-mêmes. »", "consignes": ["Présente le texte.", "Explique les idées défendues par les participants.", "Porte un jugement critique sur les limites de cette conférence.", "Dégage l'intérêt et la portée du texte."], "elements": [{"label": "Consigne 1 : Présentation du texte", "points": 2, "text": "• Nature : communiqué final (texte politique)\n• Source : conférence de Bandung (Indonésie), 18-24 avril 1955\n• Auteurs : les représentants de 29 pays d'Asie et d'Afrique\n• Destinataires : opinion mondiale, puissances coloniales, deux blocs de la guerre froide\n• Contexte : décolonisation de l'Asie, guerre froide, guerre d'Algérie naissante\n• Idée générale : condamnation du colonialisme et solidarité afro-asiatique\n• Centres d'intérêt : 1) condamnation du colonialisme et égalité des peuples, 2) coopération et coexistence pacifique"}, {"label": "Consigne 2 : Explication", "points": 3, "text": "• Le colonialisme est une injustice à combattre\n• Égalité des races et des nations, droit des peuples à disposer d'eux-mêmes\n• Coopération économique et culturelle entre pays du Sud\n• Refus de s'aligner sur les blocs : coexistence pacifique"}, {"label": "Consigne 3 : Jugement critique", "points": 3, "text": "• Résolution sans moyens de contrainte\n• Pays participants aux régimes et intérêts très différents\n• Peu de représentants de l'Afrique noire, encore largement colonisée\n• Divergences sur le rapport aux deux blocs"}, {"label": "Consigne 4 : Intérêt et portée", "points": 2, "text": "• Intérêt : naissance du Tiers Monde et du non-alignement\n• Portée : encourage les nationalistes africains, renforce la pression sur l'ONU, prépare l'indépendance du Ghana (1957) et la vague de 1960"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "Thème : États-Unis (agriculture)", "contexte": "L'agriculture américaine est l'une des plus performantes du monde, mais elle a un coût pour l'environnement.", "tache": "Pour expliquer la puissance agricole des États-Unis, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Expose les performances de l'agriculture des États-Unis.", "Présente les revers de cette « arme verte » sur l'environnement.", "Propose deux solutions pour atténuer l'un de ces revers."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : les États-Unis comptent parmi les premiers producteurs et exportateurs agricoles du monde\n• Problématique : une agriculture puissante mais qui a des conséquences environnementales\n• Plan : performances, revers, solutions"}, {"label": "Consigne 1", "points": 3, "text": "• Grandes exploitations, mécanisation, engrais, biotechnologies\n• Spécialisation régionale : Corn Belt (maïs), Wheat Belt (blé), soja, coton, élevage\n• Agrobusiness et soutien de l'État\n• Fortes exportations, arme de la diplomatie économique\n• Transition : cette puissance a des revers"}, {"label": "Consigne 2", "points": 3, "text": "• Érosion et appauvrissement des sols\n• Pollution des eaux par les engrais et pesticides\n• Baisse des nappes souterraines (irrigation)\n• Monoculture et perte de biodiversité\n• Transition : il faut donc atténuer ces effets"}, {"label": "Consigne 3", "points": 3, "text": "• Exemple : pollution par les engrais. Solutions : réduire et mieux cibler les intrants (agriculture de précision), développer l'agriculture biologique et la rotation des cultures\n• Autre exemple : baisse des nappes. Solutions : irrigation économe, cultures moins gourmandes en eau"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : une agriculture performante mais qui doit devenir plus durable\n• Ouverture : agriculture et changement climatique"}]}]}, {"id": "CD9", "num": "9", "parts": [{"partie": "Histoire", "type": "Réponds directement aux consignes", "sa": "Thème : décolonisation", "contexte": "Après l'indépendance, plusieurs pays africains ont dû gérer un héritage colonial lourd.", "tache": "Réponds directement aux consignes suivantes.", "support": "", "consignes": ["Cite trois conséquences immédiates de la colonisation sur les nouveaux États africains.", "Explique pourquoi certains pays ont connu une décolonisation plus difficile que d'autres.", "Donne ton opinion sur les liens qui persistent entre certaines anciennes colonies et leur ancienne métropole."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Frontières héritées de la colonisation, souvent sans lien avec les réalités ethniques\n• Manque de cadres et d'administrateurs formés\n• Économies tournées vers l'exportation de matières premières, peu diversifiées"}, {"label": "Consigne 2", "points": 3, "text": "• Selon la présence de colons (nombreux en Algérie, au Kenya) opposés à l'indépendance\n• Selon l'attitude de la métropole (négociation en France, refus au Portugal)\n• Selon la préparation politique et administrative des territoires avant l'indépendance"}, {"label": "Consigne 3", "points": 4, "text": "• Opinion argumentée : des liens historiques, linguistiques et culturels perdurent utilement (coopération, éducation, commerce), mais ils peuvent aussi entretenir une dépendance économique et politique ; un partenariat équilibré doit remplacer les anciens rapports coloniaux"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "Thème : Japon", "contexte": "Le Japon est souvent cité comme modèle pour les pays qui cherchent à se développer malgré des ressources naturelles limitées.", "tache": "Pour expliquer la stratégie industrielle du Japon, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les facteurs organisationnels de la réussite industrielle japonaise.", "Détermine les principales branches de cette industrie.", "Dégage les leçons que d'autres pays peuvent en tirer."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : sans grandes ressources naturelles, le Japon est devenu une puissance industrielle\n• Problématique : cette réussite repose sur une organisation particulière, transposable en partie ailleurs\n• Plan : facteurs organisationnels, branches industrielles, leçons"}, {"label": "Consigne 1", "points": 3, "text": "• Grandes firmes intégrées aux banques (keiretsu)\n• Sociétés de commerce (sôgo shosha) qui organisent import-export\n• Réseau dense de sous-traitants\n• Coopération étroite entre l'État et les entreprises\n• Cercles de qualité et forte discipline au travail\n• Transition : cette organisation a permis l'essor de branches précises"}, {"label": "Consigne 2", "points": 3, "text": "• Automobile et construction navale\n• Électronique et robotique\n• Sidérurgie et chimie, en amont des autres industries\n• Transition : cette expérience peut inspirer d'autres pays"}, {"label": "Consigne 3", "points": 3, "text": "• Investir dans la formation technique et la discipline de travail\n• Encourager la coopération entre l'État et les entreprises\n• Organiser les producteurs et sous-traitants en réseaux solidaires\n• Miser sur la qualité pour conquérir des marchés extérieurs"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : le modèle japonais repose sur l'organisation plus que sur les ressources\n• Ouverture : l'adapter aux réalités africaines, sans le copier tel quel"}]}]}, {"id": "CD10", "num": "10", "parts": [{"partie": "Histoire", "type": "Réponds directement aux consignes", "sa": "Thème : décolonisation", "contexte": "La décolonisation de l'Afrique a suivi des voies différentes selon les territoires.", "tache": "Réponds directement aux consignes suivantes.", "support": "", "consignes": ["Distingue la décolonisation pacifique de la décolonisation violente en donnant un exemple pour chacune.", "Explique pourquoi l'indépendance du Ghana a servi de modèle aux autres colonies africaines.", "Donne ton opinion : la violence était-elle inévitable en Algérie ?"], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Décolonisation pacifique ou négociée : réformes, négociations, peu de violence (exemples : Ghana, Dahomey)\n• Décolonisation violente : lutte armée, forte présence de colons hostiles (exemples : Algérie, Kenya, Angola)"}, {"label": "Consigne 2", "points": 3, "text": "• Premier pays d'Afrique noire indépendant (6 mars 1957)\n• Voie non violente conduite par Kwame Nkrumah (grèves, boycotts, négociations)\n• Exemple d'espoir pour les nationalistes africains et pression accrue sur les puissances coloniales"}, {"label": "Consigne 3", "points": 4, "text": "• Point de vue argumenté : la présence de nombreux colons, la volonté de la France de conserver l'Algérie et le refus des revendications nationalistes ont rendu la violence presque inévitable\n• Mais des réformes plus précoces et la reconnaissance du droit à l'autodétermination auraient pu limiter la guerre\n• Conclusion nuancée : ce n'est pas la seule voie possible, comme le montrent le Ghana et le Dahomey"}]}, {"partie": "Géographie", "type": "Commentaire de texte", "sa": "Thème : Japon", "contexte": "Le Japon doit concilier puissance industrielle et protection de l'environnement.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer les nuisances environnementales de l'industrie japonaise.", "support": "Texte (rédigé pour l'exercice) : « Après la guerre, le Japon a bâti une puissante industrie sur sa façade pacifique. Cette réussite a eu un coût : l'air et l'eau ont été gravement pollués, et les déchets industriels se sont accumulés. En mars 2011, l'accident de la centrale nucléaire de Fukushima, après un tsunami, a rappelé les risques d'une économie très consommatrice d'énergie. Depuis, le pays renforce ses normes, recycle davantage, développe des technologies propres et cherche à économiser l'énergie. »", "consignes": ["Présente le texte.", "Décris les nuisances de l'industrie japonaise évoquées dans le texte.", "Explique les facteurs de ces nuisances.", "Montre les réponses apportées par le Japon.", "Donne ton opinion sur l'énergie nucléaire pour un pays sans ressources en énergie."], "elements": [{"label": "Consigne 1", "points": 2, "text": "• Nature : texte explicatif\n• Source : texte rédigé pour l'exercice\n• Cadre géographique : Japon, pays à économie dominante d'Asie de l'Est\n• Idée générale : l'industrie a apporté la puissance mais aussi des nuisances\n• Centres d'intérêt : 1) les nuisances, 2) les réponses"}, {"label": "Consigne 2", "points": 2, "text": "• Pollution de l'air et de l'eau\n• Déchets industriels\n• Risque nucléaire (accident de Fukushima, 2011)"}, {"label": "Consigne 3", "points": 2, "text": "• Industrialisation rapide et concentration des usines sur la façade pacifique\n• Forte consommation d'énergie importée\n• Densité de population sur un espace exigu"}, {"label": "Consigne 4", "points": 2, "text": "• Normes environnementales et contrôles\n• Recyclage des déchets et technologies propres\n• Économies d'énergie"}, {"label": "Consigne 5", "points": 2, "text": "• Opinion argumentée : le nucléaire réduit la dépendance énergétique mais Fukushima montre ses risques ; il faut diversifier (énergies renouvelables, économies d'énergie) et renforcer la sécurité"}]}]}, {"id": "CD11", "num": "11", "parts": [{"partie": "Histoire", "type": "Dissertation", "sa": "Thème : décolonisation (Congo)", "contexte": "Le 30 juin 1960, le Congo belge accède à l'indépendance mais sombre aussitôt dans une grave crise.", "tache": "Pour expliquer la crise du Congo, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente la situation du Congo belge à l'indépendance.", "Décris la crise de 1960-1961 et l'intervention de l'ONU.", "Porte un jugement critique sur les conséquences de cette crise."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : en 1960, année des indépendances africaines, le Congo belge devient indépendant\n• Problématique : pourquoi l'indépendance du Congo a-t-elle été suivie d'une grave crise ?\n• Plan : situation à l'indépendance, crise et intervention de l'ONU, jugement critique"}, {"label": "Consigne 1", "points": 3, "text": "• Indépendance proclamée le 30 juin 1960 : Patrice Lumumba Premier ministre, Joseph Kasa-Vubu président\n• Décolonisation précipitée : peu de cadres africains formés\n• Rivalités politiques et régionales, richesses minières convoitées\n• Transition : la crise éclate quelques jours plus tard"}, {"label": "Consigne 2", "points" ent", "q": "Que signifie le principe « pollueur-payeur » ?", "r": "Celui qui pollue prend en charge les coûts de prévention et de lutte contre la pollution ; principe défini par l'OCDE en 1972."}, {"partie": "Géographie", "sa": "Thème : États-Unis", "q": "Cite deux revers de l'« arme verte » américaine.", "r": "Érosion et appauvrissement des sols, pollution par engrais et pesticides, baisse des nappes d'eau."}, {"partie": "Géographie", "sa": "Thème : États-Unis", "q": "Quelle part du PIB représente le tertiaire américain ?", "r": "Environ les 4/5 du PIB."}, {"partie": "Histoire", "sa": "Thème : décolonisation", "q": "Quelles sont les trois options offertes aux Algériens par de Gaulle le 16 septembre 1959 ?", "r": "Sécession (rompre avec la France), association avec la France, francisation (union étroite)."}, {"partie": "Histoire", "sa": "Thème : décolonisation", "q": "Qui est Kwame Nkrumah ?", "r": "Leader du Convention People's Party, père de l'indépendance du Ghana (6 mars 1957), panafricaniste."}, {"partie": "Histoire", "sa": "Thème : décolonisation", "q": "Cite les formes de la décolonisation avec un exemple pour chacune.", "r": "Pacifique ou négociée : Ghana, Dahomey ; violente : Algérie, Kenya, Angola ; précipitée et conflictuelle : Congo belge."}, {"partie": "Histoire", "sa": "Thème : décolonisation", "q": "Donne deux conséquences de la crise du Congo en 1960.", "r": "Sécession du Katanga, intervention de l'ONU, assassinat de Lumumba (janvier 1961), instabilité durable."}, {"partie": "Histoire", "sa": "Thème : décolonisation", "q": "Que retiens-tu de la conférence de Bandung (1955) ?", "r": "29 pays d'Asie et d'Afrique condamnent le colonialisme et affirment la coexistence pacifique et le non-alignement ; naissance du Tiers Monde."}, {"partie": "Géographie", "sa": "Thème : Japon", "q": "Quels événements de 1995 et de 2011 illustrent les risques naturels au Japon ?", "r": "Le séisme de Kobé (1995) ; le tsunami de mars 2011 et l'accident nucléaire de Fukushima. const KEY = 'hgb_v2';
const FS = [0.9, 1, 1.12, 1.26, 1.42];
function blankP(){ return {fiches:{}, eps:{}, exos:{}, qs:{}, stats:{}, weak:{}, seen:{}, quiz:{}, hist:[]}; }
let store = {settings:{theme:'auto', fs:1, font:'sans'}, prog:{AB:blankP(), CD:blankP()}, days:[], last:null, serie:null};
function loadStore(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const s = JSON.parse(raw);
      store.settings = Object.assign(store.settings, s.settings||{});
      ['AB','CD'].forEach(k=>{ store.prog[k] = Object.assign(blankP(), (s.prog||{})[k]||{}); });
      store.days = Array.isArray(s.days) ? s.days : [];
      store.last = s.last || null; store.serie = s.serie || null;
    }
  }catch(e){}
}
function saveStore(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
function applySettings(){
  const r = document.documentElement, s = store.settings;
  if(s.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', s.theme);
  r.style.setProperty('--scale', FS[s.fs] || 1);
  r.setAttribute('data-font', s.font || 'sans');
}

/* ============================ utilitaires ============================ */
const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function nl(s){ return esc(s).replace(/\n/g,'<br>'); }
function fmt(n){ return String(Math.round(n*10)/10).replace('.',','); }
function hash(s){ let h = 5381; for(let i=0;i<s.length;i++) h = ((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function touchDay(){ const t = fmtDate(new Date()); if(!store.days.includes(t)){ store.days.push(t); if(store.days.length>400) store.days = store.days.slice(-400); } }
function streak(){
  const set = new Set(store.days); let n = 0; const d = new Date();
  if(!set.has(fmtDate(d))) d.setDate(d.getDate()-1);
  while(set.has(fmtDate(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function weekDots(){
  const set = new Set(store.days), out = [], now = new Date();
  for(let k=6;k>=0;k--){ const x = new Date(now.getFullYear(), now.getMonth(), now.getDate()-k); out.push({on:set.has(fmtDate(x)), l:'DLMMJVS'[x.getDay()], today:k===0}); }
  return out;
}
function ring(pct, size, sw, label){
  size = size||64; sw = sw||7; pct = Math.max(0, Math.min(1, pct||0));
  const r = (size-sw)/2, c = 2*Math.PI*r, off = c*(1-pct), h = size/2;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${Math.round(pct*100)} pour cent"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--chip-strong)" stroke-width="${sw}"/><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${h} ${h})"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="${size*0.27}" font-weight="800">${label!=null?label:Math.round(pct*100)+'%'}</text></svg>`;
}
function bar(pct, cls){ return `<div class="bar ${cls||''}"><i style="width:${Math.round(Math.max(0,Math.min(1,pct||0))*100)}%"></i></div>`; }
let toastT;
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2800); }

function fmtLine(t){
  t = t.replace(/^•\s*/,'');
  const m = t.match(/^([^:]{2,42}?) : (.+)$/);
  return m ? `<strong>${esc(m[1])}</strong> : ${esc(m[2])}` : esc(t);
}
function prose(text){
  const lines = (text||'').split('\n').filter(x=>x.trim());
  let html = '', list = [];
  const flush = () => { if(list.length){ html += '<ul class="bul">'+list.map(x=>`<li>${fmtLine(x)}</li>`).join('')+'</ul>'; list = []; } };
  lines.forEach(l=>{ if(l.trim().startsWith('•')) list.push(l.trim()); else { flush(); html += `<p>${esc(l)}</p>`; } });
  flush();
  return html;
}

/* ============================ progression ============================ */
function ficheKey(f){ return f.groupe+'|'+f.rubrique; }
function ficheState(f){ const s = P().fiches[ficheKey(f)]; return s ? (s.done ? 2 : 1) : 0; }
function stats(serie){
  const d = DATA[dk(serie)], p = store.prog[serie];
  const fTot = d.fiches.length; let fRead = 0, fDone = 0;
  d.fiches.forEach(f=>{ const s = p.fiches[f.groupe+'|'+f.rubrique]; if(s){ fRead++; if(s.done) fDone++; } });
  let eTot = 0, eDone = 0, got = 0, max = 0;
  d.epreuves.forEach(e=>e.parts.forEach((pt,pi)=>{ eTot++; const r = p.eps[e.id+'_'+pi]; if(r && r.done){ eDone++; if(r.total>0){ got += r.got; max += r.total; } } }));
  (d.exercices||[]).forEach(x=>{ eTot++; const r = p.exos[x.id]; if(r && r.done){ eDone++; if(r.total>0){ got += r.got; max += r.total; } } });
  const qTot = d.questions.length; let qOk = 0, qAgain = 0;
  d.questions.forEach(q=>{ const s = p.qs[hash(q.q)]; if(s==='ok') qOk++; else if(s==='again') qAgain++; });
  const last5 = p.hist.slice(-5);
  const qz = last5.length ? last5.reduce((a,h)=>a+h.s/h.t,0)/last5.length : 0;
  const fichePct = fTot ? (fRead*0.5+fDone*0.5)/fTot : 0, epPct = eTot ? eDone/eTot : 0, qPct = qTot ? qOk/qTot : 0;
  return {fTot, fRead, fDone, eTot, eDone, epAvg: max ? got/max : null, qTot, qOk, qAgain, qz, qzN:p.hist.length,
          overall: 0.3*fichePct + 0.25*epPct + 0.2*qPct + 0.25*qz};
}
function level(p){ return p<.15 ? 'Tu démarres' : p<.4 ? 'En progression' : p<.7 ? 'Bien avancé(e)' : p<.9 ? 'Presque prêt(e)' : 'Prêt(e) pour le BAC'; }

function setLast(label){ store.last = {serie:S.serie, tab:S.tab, detail:S.detail, label}; }
function resume(){
  const l = store.last; if(!l || !DATA[dk(l.serie)]) return;
  const dd = DATA[dk(l.serie)], k = l.detail && l.detail.kind; let ok = true;
  if(k==='fiche') ok = !!dd.fiches[l.detail.i];
  else if(k==='epreuve') ok = !!dd.epreuves[l.detail.i];
  else if(k==='exo') ok = !!(dd.exercices||[])[l.detail.i];

  if(!ok){ store.last = null; saveStore(); render(); return; }
  S.serie = l.serie; S.view = 'main'; S.tab = l.tab; S.detail = l.detail; S.filter = '';

function titleFor(){
  if(S.view === 'home') return 'Histoire-Géo Bénin';
  const sl = serieLabel(S.serie);

    const k = S.detail.kind;
    if(k==='fiche') return D().fiches[S.detail.i].rubrique;

    if(k==='cards') return 'Auto-évaluation';
    if(k==='qlist') return 'Toutes les questions';
  }
  return ({fiches:'Fiches de cours', epreuves:'Épreuves et exercices', quiz:'Quiz', reperes:'Repères', progres:'Ma progression'})[S.tab] + ' · ' + sl;
}

function ficheGroups(){ const m = {}; D().fiches.forEach((f,i)=>{ (m[f.groupe] = m[f.groupe]||[]).push(i); }); return m; }
function groupTitle(g){ const d = D(); return (d.sa && d.sa[g]) || (d.themes && d.themes[g]) || g; }
function firstIncomplete(){
  const d = D(), gr = ficheGroups();
  for(const g of Object.keys(gr)){ if(gr[g].some(i=>ficheState(d.fiches[i])===0)) return g; }
  return Object.keys(gr)[0];
}
function renderFiches(){

function fichesResults(){
  const d = D(), q = S.filter.trim().toLowerCase(), gr = ficheGroups(), fi = firstIncomplete();

/* corrigé + auto-notation */
function corrHTML(kind, key, els){
  const id = kind+':'+key; REG[id] = els;
  const rec = P()[kind][key] || {}, shown = S.shown[id];
  if(!shown){
    return `<p class="muted small">Essaie d'abord de répondre sans regarder. Le corrigé permet ensuite de calculer ta note.</p><button class="btn primary block" onclick="showCorr('${kind}','${key}',true)">Voir le corrigé</button>`;
  }
  return `<p class="muted small">Coche les éléments que tu avais dans ta copie : ta note se calcule toute seule.</p>` +
    els.map((e,i)=>`<label class="chk"><input type="checkbox" ${rec.sel&&rec.sel[i]?'checked':''} onchange="toggleEl('${kind}','${key}',${i},this.checked)"><span style="flex:1"><strong>${esc(e.label)}</strong><span class="badge-pts">${fmt(e.points)} pt${e.points>1?'s':''}</span><span class="ct">${prose(e.text)}</span></span></label>`).join('') +
    `<div id="sc_${kind}_${key}">${scoreHTML(kind,key)}</div>
     <button class="btn ghost block" onclick="showCorr('${kind}','${key}',false)">Masquer le corrigé</button>`;
}
function scoreHTML(kind,key){
  const els = REG[kind+':'+key] || [], total = els.reduce((a,e)=>a+e.points,0), rec = P()[kind][key];
  if(rec && rec.done && !rec.nograde){
    const pct = total ? rec.got/total : 0;
    const msg = pct>=.8 ? 'Excellent travail !' : pct>=.5 ? 'Bien, continue comme ça.' : 'À retravailler : relis la fiche du thème.';
    return `<div class="score"><strong>${fmt(rec.got)} / ${fmt(total)}</strong><span>${msg}</span>${bar(pct,'ok')}</div>`;
  }
  if(rec && rec.done) return `<div class="score"><strong>Traité ✓</strong><span>Marqué comme traité, sans note.</span></div>`;
  return `<div class="score"><strong>0 / ${fmt(total)}</strong><span>Coche les éléments obtenus, ou marque simplement l'épreuve comme traitée.</span><button class="btn" onclick="markDone('${kind}','${key}')">Marquer comme traité</button></div>`;
}
function showCorr(kind,key,on){ S.shown[kind+':'+key] = on; render(); }
function toggleEl(kind,key,i,on){
  const els = REG[kind+':'+key], p = P();
  const rec = p[kind][key] = p[kind][key] || {sel:[], got:0, total:0, done:false};
  rec.sel = rec.sel || []; rec.sel[i] = on;
  rec.got = els.reduce((a,e,j)=>a+(rec.sel[j]?e.points:0),0);
  rec.total = els.reduce((a,e)=>a+e.points,0);
  rec.done = true; rec.nograde = false; rec.t = Date.now();
  touchDay(); saveStore();
  $('sc_'+kind+'_'+key).innerHTML = scoreHTML(kind,key);
}
function markDone(kind,key){
  const p = P(); const rec = p[kind][key] = p[kind][key] || {sel:[], got:0, total:0};
  rec.done = true; rec.nograde = true; rec.t = Date.now();
  touchDay(); saveStore(); $('sc_'+kind+'_'+key).innerHTML = scoreHTML(kind,key);
}

/* ============================ quiz ============================ */
const MODE_NAME = {qcm:'QCM express', mix:'Examen blanc', dates:'Défi dates', persos:'Qui est-ce ?', theme:'Quiz par thème', cards:'Auto-évaluation'};
function qcmPool(){ return (D().qcm||[]).map(x=>({id:hash(x.q), q:x.q, ok:x.ok, ko:x.ko, e:x.e, tag:x.tag})); }
function datesPool(){
  const all = D().reperes.filter(r=>r.cat==='Chronologie');
  const years = [...new Set(all.map(r=>r.a))];
  return all.filter(r=>!/\b(1[89]|20)\d\d\b/.test(r.b)).map(r=>{
    const y = parseInt(r.a,10);
    const ko = years.filter(x=>x!==r.a).map(x=>({x, w:Math.abs(parseInt(x,10)-y)+Math.random()*12})).sort((a,b)=>a.w-b.w).slice(0,3).map(o=>o.x);
    return {id:'d'+hash(r.a+r.b), q:'Quelle année correspond à : '+r.b+' ?', ok:r.a, ko, e:r.a+' : '+r.b+'.', tag:'Repères'};
  });
}
function personsPool(){
  const ps = D().reperes.filter(r=>r.cat==='Personnage'), names = ps.map(r=>r.a);
  return ps.filter(r=>!r.a.split(/[\s-]+/).some(w=>w.length>3 && r.b.includes(w))).map(r=>({
    id:'p'+hash(r.a), q:'Qui est-ce ? « '+r.b+' »', ok:r.a, ko:shuffle(names.filter(n=>n!==r.a)).slice(0,3), e:r.a+' : '+r.b+'.', tag:'Personnages'}));
}
function pickItems(pool, n){
  const st = P().stats;
  return pool.map(it=>{ const s = st[it.id]||{seen:0, wrong:0}; return {it, w:s.wrong*2 - s.seen*0.6 + Math.random()*2.2}; })
    .sort((a,b)=>b.w-a.w).slice(0,n).map(x=>x.it);
}
function startQuiz(mode, opts){
  opts = opts||{}; let pool = [], n = 10, title = MODE_NAME[mode] || 'Quiz';
  if(mode==='qcm') pool = qcmPool();
  else if(mode==='mix'){ pool = qcmPool().concat(datesPool(), personsPool()); n = 20; }
  else if(mode==='dates') pool = datesPool();
  else if(mode==='persos') pool = personsPool();
  else if(mode==='theme'){ pool = qcmPool().filter(x=>x.tag===opts.tag); title = 'Quiz · '+shortName(opts.tag); }
  else if(mode==='retry'){ pool = opts.items||[]; n = pool.length; title = 'Mes erreurs'; }
  n = Math.min(n, pool.length);
  if(!n){ toast('Pas assez de questions pour ce quiz.'); return; }
  const items = shuffle(pickItems(pool, n)).map(it=>{ const o = shuffle([it.ok].concat(it.ko)); return Object.assign({}, it, {opts:o, a:o.indexOf(it.ok)}); });
  Q = {mode, title, tag:opts.tag||null, items, i:0, score:0, ans:[], locked:false, done:false};
  S.detail = {kind:'quiz'}; go();
}
function renderQuizHome(){
  const p = P(), d = D(), s = stats(S.serie);
  const best = m => { const q = p.quiz[m]; return q ? `<span class="best">Meilleur ${q.best}%</span>` : ''; };
  const mode = (em, t, sub, act, b) => `<button class="mode" onclick="${act}"><span class="em" aria-hidden="true">${em}</span><span class="tx"><b>${t}</b><span>${sub}</span></span>${b||''}</button>`;
  let html = `<div class="card"><h2 class="sec">Teste-toi</h2><p class="muted small">Chaque quiz corrige tout de suite, garde ton score et repère tes points faibles dans « Progrès ». Les questions que tu rates reviennent plus souvent.</p></div>`;
  html += mode('🎯','QCM express','10 questions de cours, correction immédiate',"startQuiz('qcm')", best('qcm'));
  html += mode('📝','Examen blanc','20 questions mélangées : cours, dates, personnages',"startQuiz('mix')", best('mix'));
  html += mode('🗓️','Défi dates','Retrouve l\'année de chaque événement',"startQuiz('dates')", best('dates'));
  html += mode('🧑🏾‍🏫','Qui est-ce ?','Reconnais les grands personnages',"startQuiz('persos')", best('persos'));
  html += mode('🃏','Cartes d\'auto-évaluation',`Réponds de tête, puis note-toi · ${s.qAgain} à revoir, ${s.qOk} maîtrisée${s.qOk>1?'s':''}`,'startCards()', best('cards'));
  const themes = Object.keys(D().short||{}).filter(g=>(D().qcm||[]).filter(x=>x.tag===g).length>=3);
  html += `<h2 class="sec" style="margin-top:1.2rem">Par thème</h2><div class="pill-row">` + themes.map(g=>`<button class="pill" onclick="startQuiz('theme',{tag:'${g}'})">${esc(shortName(g))}</button>`).join('') + `</div>`;

function renderQuizScreen(){
  if(!Q){ S.detail = null; return ''; }
  if(Q.done) return renderQuizResult();
  const it = Q.items[Q.i], L = ['A','B','C','D'];
  return `<div class="qtop"><span>${esc(Q.title)}</span><span>${Q.i+1} / ${Q.items.length}</span></div>${bar(Q.i/Q.items.length)}
  <article class="card fade-in" style="margin-top:.8rem"><span class="tag">${esc(shortName(it.tag))}</span>
    <h2 class="qtext">${esc(it.q)}</h2>
    <div role="group" aria-label="Réponses">${it.opts.map((o,k)=>`<button class="opt" id="opt${k}" onclick="answerQ(${k})"><b>${L[k]}</b><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="qfb" aria-live="polite"></div></article>`;
}
function answerQ(k){
  if(!Q || Q.locked) return; Q.locked = true;
  const it = Q.items[Q.i], ok = k===it.a, p = P();
  Q.ans[Q.i] = {k, ok}; if(ok) Q.score++;
  it.opts.forEach((o,j)=>{ const b = $('opt'+j); if(!b) return; b.disabled = true; if(j===it.a) b.classList.add('ok'); else if(j===k) b.classList.add('bad'); });
  const s = p.stats[it.id] = p.stats[it.id] || {seen:0, wrong:0};
  s.seen++; if(!ok) s.wrong++; else if(s.wrong>0) s.wrong--;
  p.seen[it.tag] = (p.seen[it.tag]||0)+1; if(!ok) p.weak[it.tag] = (p.weak[it.tag]||0)+1;
  touchDay(); saveStore();
  const last = Q.i === Q.items.length-1;
  $('qfb').innerHTML = `<div class="fb ${ok?'ok':'bad'}"><strong>${ok?'Bonne réponse !':'Pas tout à fait.'}</strong>${ok?'':`La bonne réponse : <b>${esc(it.ok)}</b>.<br>`}${esc(it.e)}</div>
    <button class="btn primary block" id="nextBtn" onclick="nextQ()">${last?'Voir mon score':'Question suivante →'}</button>`;
  const nb = $('nextBtn'); if(nb && nb.scrollIntoView) nb.scrollIntoView({block:'nearest', behavior:'smooth'});
}
function nextQ(){
  if(!Q) return;
  if(Q.i < Q.items.length-1){ Q.i++; Q.locked = false; render(); window.scrollTo(0,0); }
  else finishQuiz();
}
function pushHist(m, tag, s, t){
  const p = P();
  p.hist.push({m, tag:tag||null, s, t, ts:Date.now()}); if(p.hist.length>60) p.hist = p.hist.slice(-60);
  const key = m==='theme' ? 'theme:'+tag : m, pct = Math.round(100*s/t), b = p.quiz[key] = p.quiz[key] || {best:0, n:0};
  b.best = Math.max(b.best, pct); b.n++; b.last = pct;
}
function finishQuiz(){
  Q.done = true;
  if(Q.mode !== 'retry') pushHist(Q.mode, Q.tag, Q.score, Q.items.length);
  saveStore(); render(); window.scrollTo(0,0);
}
function verdict(pct){ return pct>=.9 ? 'Excellent !' : pct>=.7 ? 'Très bien !' : pct>=.5 ? 'Bien, mais tu peux mieux faire' : 'Continue, tu vas y arriver'; }
function renderQuizResult(){
  const t = Q.items.length, pct = Q.score/t, wrong = Q.items.filter((it,i)=>!(Q.ans[i]&&Q.ans[i].ok));
  const bk = Q.mode==='theme' ? 'theme:'+Q.tag : Q.mode, b = P().quiz[bk];
  const byTag = {}; Q.items.forEach((it,i)=>{ const g = byTag[it.tag] = byTag[it.tag]||{n:0, ok:0}; g.n++; if(Q.ans[i]&&Q.ans[i].ok) g.ok++; });
  return `<section class="card result fade-in"><span class="tag">${esc(Q.title)}</span><div class="ringwrap">${ring(pct,120,11,Q.score+'/'+t)}</div>
    <h2>${verdict(pct)}</h2><p class="muted">${Math.round(pct*100)} % de bonnes réponses${b && Q.mode!=='retry' ? ` · meilleur score : ${b.best} %` : ''}</p>
    ${Object.keys(byTag).length>1 ? `<div style="text-align:left;margin-top:1rem">${Object.keys(byTag).map(g=>`<div class="metric"><div class="top"><span>${esc(shortName(g))}</span><span>${byTag[g].ok}/${byTag[g].n}</span></div>${bar(byTag[g].ok/byTag[g].n,'ok')}</div>`).join('')}</div>` : ''}
  </section>
  ${wrong.length ? `<section class="card"><h2 class="sec">À revoir (${wrong.length})</h2>${wrong.map(it=>`<div class="miss"><p><b>${esc(it.q)}</b></p><p class="g">✓ ${esc(it.ok)}</p><p class="muted">${esc(it.e)}</p></div>`).join('')}</section>` : `<div class="card center" style="text-align:center">Aucune erreur, bravo ! 🎉</div>`}
  ${wrong.length ? `<button class="btn primary block" onclick="retryWrong()">Refaire mes erreurs</button>` : ''}
  <button class="btn block" onclick="replayQuiz()">Rejouer</button>
  <button class="btn ghost block" onclick="goBack()">Retour aux quiz</button>`;
}
function retryWrong(){ const items = Q.items.filter((it,i)=>!(Q.ans[i]&&Q.ans[i].ok)); startQuiz('retry', {items}); }
function replayQuiz(){ const m = Q.mode==='retry' ? 'qcm' : Q.mode, tag = Q.tag; startQuiz(m, {tag}); }

/* cartes d'auto-évaluation */
function startCards(){
  const d = D(), p = P();
  const w = q => { const s = p.qs[hash(q.q)]; return (s==='again'?3:(s==='ok'?0:2)) + Math.random(); };
  const items = shuffle(d.questions.slice().sort((a,b)=>w(b)-w(a)).slice(0,10));
  C = {items, i:0, shown:false, ok:0, again:[], done:false};
  S.detail = {kind:'cards'}; go();
}
function renderCards(){
  if(!C){ S.detail = null; return ''; }
  if(C.done) return renderCardsResult();
  const q = C.items[C.i];
  return `<div class="qtop"><span>Auto-évaluation</span><span>${C.i+1} / ${C.items.length}</span></div>${bar(C.i/C.items.length)}
  <article class="card fade-in" style="margin-top:.8rem"><div class="row wrap"><span class="tag">${esc(q.partie)}</span><span class="tag alt">${esc(shortSa(q.sa))}</span></div>
    <h2 class="qtext">${esc(q.q)}</h2>
    ${C.shown ? `<div class="answer">${nl(q.r)}</div><p class="muted small" style="margin-bottom:.5rem">Avais-tu la bonne réponse ?</p>
      <div class="grid2"><button class="btn bad-b" onclick="rateCard(false)">🔁 À revoir</button><button class="btn ok-b" onclick="rateCard(true)">✅ Je savais</button></div>`
    : `<p class="muted">Réponds de tête ou sur ton cahier, puis vérifie.</p><button class="btn primary block" onclick="C.shown=true;render()">Voir la réponse</button>`}
  </article>`;
}
function rateCard(ok){
  const q = C.items[C.i]; P().qs[hash(q.q)] = ok ? 'ok' : 'again';
  if(ok) C.ok++; else C.again.push(q);
  touchDay(); C.i++; C.shown = false;
  if(C.i >= C.items.length){ C.done = true; pushHist('cards', null, C.ok, C.items.length); }
  saveStore(); render(); window.scrollTo(0,0);
}
function renderCardsResult(){
  const t = C.items.length, pct = C.ok/t;
  return `<section class="card result fade-in"><span class="tag">Auto-évaluation</span><div class="ringwrap">${ring(pct,120,11,C.ok+'/'+t)}</div><h2>${verdict(pct)}</h2><p class="muted">${C.ok} question${C.ok>1?'s':''} sue${C.ok>1?'s':''} sur ${t}</p></section>
  ${C.again.length ? `<section class="card"><h2 class="sec">À revoir (${C.again.length})</h2>${C.again.map(q=>`<div class="miss"><p><b>${esc(q.q)}</b></p><p class="g">${nl(q.r)}</p></div>`).join('')}</section>` : `<div class="card" style="text-align:center">Tu maîtrises cette série de cartes 🎉</div>`}
  <button class="btn primary block" onclick="startCards()">Nouvelle série de cartes</button>
  <button class="btn ghost block" onclick="goBack()">Retour aux quiz</button>`;
}
function openQList(){ S.detail = {kind:'qlist'}; S.filter = ''; go(); }
function renderQList(){
  return `<div class="card"><label class="sr" for="q">Rechercher</label><input id="q" type="search" placeholder="Rechercher une question…" value="${esc(S.filter)}" oninput="S.filter=this.value;$('res').innerHTML=qlistResults()"></div><div id="res">${qlistResults()}</div>`;
}
function qlistResults(){
  const d = D(), p = P(), q = S.filter.trim().toLowerCase(); let n = 0, html = '<div class="card">';
  d.questions.forEach(it=>{
    if(q && !(it.q+' '+it.r+' '+it.sa).toLowerCase().includes(q)) return; n++;
    const h = hash(it.q), st = p.qs[h], open = S.shown['q'+h];
    html += `<div class="qa"><div class="row wrap"><span class="tag">${esc(it.partie)}</span><span class="tag alt">${esc(shortSa(it.sa))}</span>${st==='ok'?'<span class="chip done">✓ maîtrisée</span>':st==='again'?'<span class="chip">🔁 à revoir</span>':''}</div>
      <p class="q">${esc(it.q)}</p>
      ${open ? `<div class="answer">${nl(it.r)}</div><div class="grid2"><button class="btn bad-b" onclick="markQ('${h}','again')">🔁 À revoir</button><button class="btn ok-b" onclick="markQ('${h}','ok')">✅ Je savais</button></div>` : ''}
      <button class="btn ghost" style="margin-top:.4rem" onclick="toggleQ('${h}')">${open?'Masquer la réponse':'Voir la réponse'}</button></div>`;
  });
  html += '</div>';
  return n ? html : '<div class="empty">Aucune question trouvée.</div>';
}
function toggleQ(h){ S.shown['q'+h] = !S.shown['q'+h]; $('res').innerHTML = qlistResults(); }
function markQ(h,v){ P().qs[h] = v; touchDay(); saveStore(); $('res').innerHTML = qlistResults(); }

/* ============================ repères ============================ */
function renderReperes(){
  return `<div class="pill-row"><button class="pill ${S.rep==='chrono'?'on':''}" onclick="setRep('chrono')">Chronologie</button><button class="pill ${S.rep==='perso'?'on':''}" onclick="setRep('perso')">Personnages</button></div>
  <div class="grid2" style="margin-bottom:.8rem"><button class="btn" onclick="startQuiz('dates')">🗓️ Défi dates</button><button class="btn" onclick="startQuiz('persos')">🧑🏾‍🏫 Qui est-ce ?</button></div>
  <div class="card"><label class="sr" for="q">Rechercher</label><input id="q" type="search" placeholder="Rechercher un repère…" value="${esc(S.filter)}" oninput="S.filter=this.value;$('res').innerHTML=reperesResults()"></div>
  <div id="res">${reperesResults()}</div>`;
}
function setRep(k){ S.rep = k; S.filter = ''; render(); }
function initials(a){ return a.split(/[\s-]+/).filter(w=>/^[A-ZÀ-Ý]/.test(w)).slice(0,2).map(w=>w[0]).join(''); }
function reperesResults(){
  const q = S.filter.trim().toLowerCase();
  const list = D().reperes.filter(r=>r.cat===(S.rep==='perso'?'Personnage':'Chronologie')).filter(r=>!q || (r.a+' '+r.b).toLowerCase().includes(q));
  if(!list.length) return '<div class="empty">Aucun résultat.</div>';
  if(S.rep==='perso') return '<div class="card">'+list.map(r=>`<div class="pers"><span class="av" aria-hidden="true">${esc(initials(r.a))}</span><div><strong>${esc(r.a)}</strong><p>${esc(r.b)}</p></div></div>`).join('')+'</div>';
  return '<div class="card"><ol class="timeline">'+list.map(r=>`<li><span class="yr">${esc(r.a)}</span><p>${esc(r.b)}</p></li>`).join('')+'</ol></div>';
}

/* ============================ progrès ============================ */
function nextStep(){
  const d = D(), p = P(), gr = ficheGroups(), s = stats(S.serie);
  if(s.fRead>=3 && p.hist.length===0) return {txt:'Fais ton premier QCM express pour tester tes connaissances', act:"startQuiz('qcm')"};
  for(const g of Object.keys(gr)){
    const i = gr[g].find(i=>ficheState(d.fiches[i])===0);
    if(i!==undefined) return {txt:`Lis la fiche « ${d.fiches[i].rubrique} » (${shortName(g)})`, act:`openFiche(${i})`};
  }
  for(let e=0;e<d.epreuves.length;e++) for(let pi=0;pi<d.epreuves[e].parts.length;pi++){
    if(!(p.eps[d.epreuves[e].id+'_'+pi]||{}).done) return {txt:`Traite l'épreuve n°${d.epreuves[e].num} (${d.epreuves[e].parts[pi].partie})`, act:`openEpreuve(${e},${pi})`};
  }
  return {txt:'Consolide avec un examen blanc de 20 questions', act:"startQuiz('mix')"};
}
function metric(label, val, pct, sub){
  return `<div class="metric"><div class="top"><span>${label}</span><span>${val}</span></div>${bar(pct)}<small>${sub}</small></div>`;
}
function weakTopics(){
  const p = P(); return Object.keys(p.seen).map(t=>({t, n:p.seen[t], w:p.weak[t]||0})).filter(x=>x.n>=2 && x.w/x.n>=0.25).sort((a,b)=>b.w/b.n-a.w/a.n).slice(0,3);
}
function goTopic(t){
  const gr = ficheGroups();
  if(gr[t]){ S.tab='fiches'; S.detail=null; S.openG[t]=true; S.filter=''; go(); }
  else if(t==='Repères'){ S.tab='reperes'; S.rep='chrono'; S.detail=null; S.filter=''; go(); }
  else { S.tab='reperes'; S.rep='perso'; S.detail=null; S.filter=''; go(); }
}
function quizTopic(t){ if(t==='Repères') startQuiz('dates'); else if(t==='Personnages') startQuiz('persos'); else startQuiz('theme',{tag:t}); }
function renderProgres(){
  const s = stats(S.serie), p = P(), st = streak(), nx = nextStep(), d = D();
  const wk = weekDots().map(x=>`<span class="${x.on?'on':''} ${x.today?'today':''}" aria-label="${x.on?'étudié':'pas d\'étude'}">${x.l}</span>`).join('');
  let html = `<section class="card hero2 fade-in"><div class="ringwrap">${ring(s.overall,96,10)}</div>
    <div><h2>${level(s.overall)}</h2><p class="muted small">Préparation · Séries ${serieLabel(S.serie)}</p>
    <div class="week" role="img" aria-label="Activité des 7 derniers jours">${wk}</div>
    <p class="muted small" style="margin-top:.4rem">${st>0 ? '🔥 '+st+' jour'+(st>1?'s':'')+' d\'affilée' : 'Étudie un peu aujourd\'hui pour lancer ta série'}</p></div></section>
  <section class="card next"><b>Prochaine étape</b><p style="margin:.3rem 0 .2rem">${esc(nx.txt)}</p><button class="btn primary block" onclick="${nx.act}">C'est parti →</button></section>
  <h2 class="sec">Détail</h2><section class="card">
    ${metric('Fiches lues', s.fRead+'/'+s.fTot, s.fRead/s.fTot, s.fDone+' maîtrisée'+(s.fDone>1?'s':''))}
    ${metric('Épreuves et exercices traités', s.eDone+'/'+s.eTot, s.eTot?s.eDone/s.eTot:0, s.epAvg!==null ? 'Moyenne de tes auto-notations : '+fmt(s.epAvg*20)+'/20' : 'Pas encore de note')}
    ${metric('Cartes de révision maîtrisées', s.qOk+'/'+s.qTot, s.qTot?s.qOk/s.qTot:0, s.qAgain+' à revoir')}
    ${metric('Quiz', s.qzN ? Math.round(s.qz*100)+' %' : '—', s.qz, s.qzN+' quiz joué'+(s.qzN>1?'s':'')+' · moyenne des 5 derniers')}
  </section>`;
  const wk2 = weakTopics();
  if(wk2.length){
    html += `<h2 class="sec">À renforcer</h2><section class="card">` + wk2.map(x=>`<div class="warnrow"><span class="tx"><b>${esc(shortName(x.t))}</b><br><small class="muted">${x.w} erreur${x.w>1?'s':''} sur ${x.n} réponses</small></span><button class="btn" onclick="goTopic('${x.t}')">Réviser</button><button class="btn primary" onclick="quizTopic('${x.t}')">Quiz</button></div>`).join('') + `</section>`;
  }
  const gr = ficheGroups();
  html += `<h2 class="sec">Par thème</h2><section class="card">` + Object.keys(gr).map(g=>{
    const all = gr[g], read = all.filter(i=>ficheState(d.fiches[i])>0).length, n = p.seen[g]||0, w = p.weak[g]||0;
    return `<button class="li" onclick="goTopic('${g}')" style="flex-wrap:wrap"><span class="tx"><b>${esc(shortName(g))}</b><span>${read}/${all.length} fiches lues${n?` · ${Math.round(100*(1-w/n))} % de réussite aux quiz`:''}</span></span><span style="flex-basis:100%">${bar(read/all.length)}</span></button>`;
  }).join('') + `</section>`;
  if(p.hist.length){
    html += `<h2 class="sec">Derniers quiz</h2><section class="card">` + p.hist.slice(-5).reverse().map(h=>{
      const dt = new Date(h.ts), lab = (MODE_NAME[h.m]||h.m) + (h.tag && h.m==='theme' ? ' · '+shortName(h.tag) : '');
      return `<div class="warnrow"><span class="tx"><b>${esc(lab)}</b><br><small class="muted">${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}</small></span><strong>${h.s}/${h.t}</strong></div>`;
    }).join('') + `</section>`;
  }
  return html;
}

/* ============================ réglages, sauvegarde, hors-ligne ============================ */
const HAS_CLAUDE = !!(window.claude && window.claude.use);
function toggleSheet(){ S.sheet = !S.sheet; S.confirmReset = false; renderSheet(); }
function setSetting(k,v){ store.settings[k] = v; applySettings(); saveStore(); renderSheet(); }
function fsStep(d){ setSetting('fs', Math.max(0, Math.min(FS.length-1, store.settings.fs+d))); }
function renderSheet(){
  const el = $('sheet');
  el.hidden = !S.sheet;
  if(!S.sheet){ el.innerHTML = ''; return; }
  const s = store.settings, th = [['auto','Auto'],['light','Clair'],['dark','Sombre'],['sepia','Sépia']];
  el.innerHTML = `<div class="scrim" onclick="toggleSheet()"></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-label="Réglages">
    <div class="row between"><h2>Confort de lecture</h2><button class="icon-btn" onclick="toggleSheet()" aria-label="Fermer">✕</button></div>
    <h3>Thème</h3><div class="seg">${th.map(([k,l])=>`<button class="${s.theme===k?'on':''}" onclick="setSetting('theme','${k}')">${l}</button>`).join('')}</div>
    <h3>Taille du texte</h3><div class="row"><button class="btn" onclick="fsStep(-1)" aria-label="Réduire le texte" ${s.fs===0?'disabled':''}>A−</button><div class="dots" aria-hidden="true">${FS.map((x,i)=>`<i class="${i<=s.fs?'on':''}"></i>`).join('')}</div><button class="btn" onclick="fsStep(1)" aria-label="Agrandir le texte" ${s.fs===FS.length-1?'disabled':''}>A+</button></div>
    <h3>Police</h3><div class="seg"><button class="${s.font==='sans'?'on':''}" onclick="setSetting('font','sans')">Simple</button><button class="${s.font==='serif'?'on':''}" onclick="setSetting('font','serif')" style="font-family:Georgia,serif">Livre</button></div>
    <div class="card prose" style="margin:.6rem 0 0"><p>Le 1<sup>er</sup> août 1960, le Dahomey accède à l'indépendance ; Hubert Maga devient le premier président.</p></div>
    <h3>Ma progression</h3>
    <div class="grid2">
      ${HAS_CLAUDE ? `<button class="btn" onclick="exportProgress()">Sauvegarder (fichier)</button>` : ''}
      <label class="btn" style="text-align:center;display:flex;align-items:center;justify-content:center;cursor:pointer">Restaurer<input type="file" accept=".json,application/json" hidden onchange="importProgress(this.files[0])"></label>
    </div>
    <p class="muted small" style="margin-top:.5rem">Ta progression reste sur cet appareil. Sauvegarde-la pour la retrouver sur un autre téléphone.</p>
    ${S.confirmReset ? `<div class="grid2" style="margin-top:.6rem"><button class="btn bad-b" onclick="resetProgress()">Oui, tout effacer</button><button class="btn" onclick="S.confirmReset=false;renderSheet()">Annuler</button></div>` : `<button class="btn ghost block" onclick="S.confirmReset=true;renderSheet()">Réinitialiser ma progression</button>`}
    ${HAS_CLAUDE ? `<h3>Hors-ligne</h3><button class="btn block" style="margin-top:0" onclick="downloadOfflineCopy()">Enregistrer une copie hors-ligne</button><p class="muted small" style="margin-top:.5rem">Copie de l'application (fichier .html) qui s'ouvre sans internet. Ta progression dans la copie est séparée.</p>` : ''}
  </section>`;
}
async function saveFile(filename, data){
  try{
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if(!dl){ toast('Enregistrement indisponible ici.'); return false; }
    await dl.save({filename, data}); toast('Fichier enregistré.'); return true;
  }catch(e){ if(!(e && e.code==='declined')) toast('Impossible d\'enregistrer le fichier.'); return false; }
}
function exportProgress(){ saveFile('progression-histoire-geo-benin.json', JSON.stringify({app:'hgb', v:2, store})); }
function importProgress(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const o = JSON.parse(r.result), s = o && o.store;
      if(!s || !s.prog) throw new Error('format');
      store.settings = Object.assign(store.settings, s.settings||{});
      ['AB','CD'].forEach(k=>{ store.prog[k] = Object.assign(blankP(), (s.prog||{})[k]||{}); });
      store.days = Array.isArray(s.days) ? s.days : []; store.last = s.last||null;
      applySettings(); saveStore(); S.sheet = false; render(); toast('Progression restaurée.');
    }catch(e){ toast('Ce fichier n\'est pas une sauvegarde valide.'); }
  };
  r.readAsText(file);
}
function resetProgress(){
  store.prog = {AB:blankP(), CD:blankP()}; store.days = []; store.last = null; S.confirmReset = false; saveStore(); S.sheet = false; render(); toast('Progression réinitialisée.');
}
function downloadOfflineCopy(){
  try{
    const c = document.documentElement.cloneNode(true);
    const a = c.querySelector('#app'); if(a) a.innerHTML = '';
    const sh = c.querySelector('#sheet'); if(sh){ sh.innerHTML = ''; sh.setAttribute('hidden',''); }
    const tb = c.querySelector('#tabbar'); if(tb) tb.setAttribute('hidden','');
    const bk = c.querySelector('#backBtn'); if(bk) bk.setAttribute('hidden','');
    saveFile('histoire-geo-benin.html', '<!DOCTYPE html>\n' + c.outerHTML);
  }catch(e){ toast('La copie n\'a pas pu être créée.'); }
}

/* ============================ clavier ============================ */
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape' && S.sheet){ toggleSheet(); return; }
  if(!Q || Q.done || !S.detail || S.detail.kind!=='quiz') return;
  const t = document.activeElement && document.activeElement.tagName;
  if(t==='INPUT' || t==='TEXTAREA') return;
  const n = parseInt(e.key,10);
  if(!Q.locked && n>=1 && n<=4 && Q.items[Q.i].opts[n-1] !== undefined) answerQ(n-1);
  else if(Q.locked && e.key==='Enter' && t!=='BUTTON') nextQ();
});

/* ============================ démarrage ============================ */
loadStore(); applySettings();
if(store.serie) S.serie = store.serie;
render();
</script>
</body>
</html>
